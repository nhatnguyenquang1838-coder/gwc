<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root {
  color-scheme: light dark;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #fff;
  color: #111;
}
@media (prefers-color-scheme: dark) {
  :root {
    background: #111;
    color: #eee;
  }
}
* { box-sizing: border-box; }
body { margin: 0; padding: 1rem; line-height: 1.5; }
h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
h2 { font-size: 1rem; margin: 1rem 0 0.25rem; }
.meta { color: #555; font-size: 0.875rem; }
@media (prefers-color-scheme: dark) {
  .meta { color: #aaa; }
}
.badge { display: inline-block; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: 600; }
.badge-ready { background: #d1fae5; color: #065f46; }
.badge-pass { background: #dbeafe; color: #1e40af; }
.badge-blocked { background: #fee2e2; color: #991b1b; }
.badge-awaiting { background: #fef3c7; color: #92400e; }
.badge-current { background: #d1fae5; color: #065f46; }
.badge-stale { background: #fee2e2; color: #991b1b; }
.badge-invalid { background: #7f1d1d; color: #fff; }
section { margin: 1rem 0; padding: 0.75rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; }
@media (prefers-color-scheme: dark) {
  section { border-color: #374151; }
}
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.875rem; }
pre { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
th, td { text-align: left; padding: 0.375rem; border-bottom: 1px solid #e5e7eb; }
@media (prefers-color-scheme: dark) {
  th, td { border-bottom-color: #374151; }
}
th { font-weight: 600; }
.authority { border-left: 4px solid #991b1b; padding-left: 0.75rem; }
@media (prefers-color-scheme: dark) {
  .authority { border-left-color: #fca5a5; }
}
</style>
</head>
<body>
<h1>{{title}}</h1>
<p class="meta">Task: {{task_id}} | Repository: {{repository}} | Base: {{base_sha}} | Generated: {{generated_at_utc}}</p>

{{sections}}

<p class="authority">{{authority_notice}}</p>
</body>
</html>
