agent:
  id: dwc
  name: DWC
  version: 1.0.0

scope:
  repository: nhatnguyenquang1838-coder/gwc
  connector: DWC
  protected_branches:
    - main

capabilities:
  automatic_read:
    - repository_metadata
    - repository_tree
    - utf8_files
    - binary_files
    - workflow_runs
    - workflow_artifacts
    - pull_request_context
    - ds_admin_tasks
    - integrity_artifacts
  observability:
    structured_connector_trace:
      contract: core/CONNECTOR_TRACE_CONTRACT_v1.0.md
      schema: schemas/connector-trace.schema.json
      response_mode: additive
      required_fields:
        - trace_id
        - operation
        - failure_stage
        - connector_received
        - policy_checked
        - upstream_attempted
        - provider_request_id
        - github_request_id
        - http_status
      secret_redaction_required: true
      backend_implementation_required: true
    g4_merge_authority_receipt:
      contract: core/G5_CI_VERIFICATION_CONTRACT_v1.0.md
      evidence_schema: schemas/g4-merge-authority-receipt.schema.json
      validator: tools/validate_g4_merge_authority.py
      action_class: evidence_only
      minimum_gate: G4_MERGE
      source: human_pr_comment
      guard:
        - pr_state == open
        - pr_draft == false
        - approver_permission in [write, maintain, admin]
        - approved_head_sha == current_head_sha
        - approval_not_expired
        - authorized_action == merge_pull_request
        - manual_g5_action_authorized == false
      notes:
        - The original human PR comment is authority.
        - The bot receipt is sanitized evidence and never creates authority.
        - This capability does not invoke merge.
    g4_merge_event_proof:
      contract: core/G5_CI_VERIFICATION_CONTRACT_v1.0.md
      action_class: read_only
      minimum_gate: G4_MERGE
      source: github_pull_request_closed_event
      guard:
        - merged == true
        - approved_head_sha == merged_head_sha
        - merge_commit_sha_is_known
        - g4_authority_not_expired_at_merge
      notes:
        - GitHub merge event is merge proof.
        - Merge proof is not G5 PASS.
    g5_ci_status_verify:
      contract: core/G5_CI_VERIFICATION_CONTRACT_v1.0.md
      evidence_schema: schemas/g5-ci-verification-evidence.schema.json
      checkpoint_schema: schemas/node-architect/g5-ci-checkpoint.schema.json
      approval:
        required: false
      action_class: read_only
      minimum_gate: G5_DEPLOY
      trigger: after_g4_merge
      connector_methods:
        - fetch_commit_workflow_runs
        - get_commit_combined_status
        - fetch_workflow_run_jobs
        - fetch_workflow_run_artifacts
        - fetch_workflow_job_steps
      guard:
        - g4_authority_receipt_is_known
        - github_merge_event_proof_is_known
        - merge_commit_sha_is_known
        - selected_run_head_sha_equals_merge_commit_sha
        - canonical_machine_evidence == github_actions_artifact
        - human_traceability == github_pr_comment
        - jira_authority == projection_only
        - slack_authority == projection_only
        - no_recursive_evidence_pr == true
        - empty_pr_filtered_results_are_not_ci_pending
        - pending_state_has_checkpoint
        - manual_action_authorized == false
      classifications:
        - success
        - failure
        - CI_PENDING
        - CONNECTOR_OBSERVABILITY_INCOMPLETE
        - SHA_MISMATCH
      notes:
        - G4 evidence never satisfies G5.
        - Read-only G5 status verification only.
        - The Actions artifact is canonical; the PR comment is human traceability.
        - Does not authorize deploy, release, publish, runtime reload, merge, production data, production configuration, credentials, secrets, or migration.
  approval_policy:
    generated_artifact_refresh:
      risk: low
      branch_scope: true
      auto_approval:
        allowed: true
        conditions:
          - generated_by_verified_generator
          - protected_branch_only
          - no_merge_permission
    production_change:
      risk: high
      human_approval:
        required: true
  bounded_write_on_guarded_branch:
    create_allowed_prefix_branch: true
    create_repository_files_within_task_scope: true
    update_repository_files_within_task_scope: true
    replace_text_with_expected_state: true
    add_or_update_tests: true
    add_or_update_documentation: true
    push_working_branch: true
    open_or_update_draft_pr: true
    invoke_code_reviewer_agent:
      approval:
        required: false
      action_class: read_only
      minimum_gate: G3_PR
      evidence_schema: schemas/g3-code-review-invocation.schema.json
      validator: tools/validate_g3_review_invocation.py
      guard:
        - pr_state == draft
        - reviewer_kind == agent
        - reviewer_role == code_reviewer
        - reviewer_access_mode == read_only
        - requested_head_sha == current_head_sha
        - completed_head_sha == current_head_sha
        - scope_hash == current_scope_hash
        - write_actions == []
      notes:
        - Use only when an independent reviewer runtime is available.
        - Reviewer PASS is evidence only.
        - A reviewer write invalidates independence and requires a new exact-head review.
    record_independent_human_review:
      approval:
        required: false
      action_class: read_only
      minimum_gate: G3_PR
      execution_mode:
        - chat_connector_only
        - local_agent
      evidence_schema: schemas/g3-code-review-invocation.schema.json
      validator: tools/validate_g3_review_invocation.py
      guard:
        - pr_state == draft
        - reviewer_kind == human
        - reviewer_role == human_reviewer
        - reviewer_independence == independent
        - reviewer_id != implementer_id
        - reviewer_access_mode == read_only
        - requested_head_sha == current_head_sha
        - completed_head_sha == current_head_sha
        - scope_hash == current_scope_hash
        - explicit_review_decision == true
        - write_actions == []
      notes:
        - Capability fallback when an independent-agent runtime is unavailable.
        - Plain acknowledgements do not qualify as review evidence.
        - Human review PASS is evidence only and grants no merge authority.
    mark_pr_ready_for_review:
      tool: github_mark_pr_ready_for_review
      approval:
        required: false
      guard:
        - pr_state == draft
        - g3_delivery_record == PASS
        - g3_independent_review_evidence == PASS
        - reviewer_kind in [agent, human]
        - reviewer_role in [code_reviewer, human_reviewer]
        - reviewer_access_mode == read_only
        - reviewer_id != implementer_id
        - write_actions == []
        - expected_head_sha == current_head_sha
        - required_ci == success
        - scope_drift == false
        - no_unresolved_blocker == true
        - no_merge_permission
      readback:
        required: true
        guard:
          - observed_pr_state == open
          - observed_draft == false
          - observed_head_sha == expected_head_sha
      notes:
        - G3 metadata completion only.
        - Review PASS alone does not move work to merge_pending.
        - Do not commit the promotion receipt to the reviewed PR branch.
        - Does not grant G4 merge authority.
    comment_on_pull_request: true
    merge_human_approved_pull_request: true
    repair_repository_fixable_ci: true
    commit_generated_integrity_artifacts:
      approval:
        required: false
      guard:
        - branch != main
        - artifact_source == generator
        - validation == PASS
  work_tracking:
    create_task: true
    update_task: true
    transition_task: true
    link_task_to_pr: true

human_direction_required_for:
  - financial_impact
  - architecture_change
  - security_boundary_change
  - production_configuration
  - credential_or_secret_change
  - production_data_access
  - destructive_or_irreversible_change
  - broad_blast_radius

hard_exclusions:
  - protected_branch_direct_push
  - merge_without_exact_g4_human_approval
  - auto_merge
  - deployment
  - release
  - production_configuration
  - credential_rotation
  - production_migration
  - production_data
  - force_push
  - branch_deletion
  - shared_history_rewrite
  - pr_base_change
