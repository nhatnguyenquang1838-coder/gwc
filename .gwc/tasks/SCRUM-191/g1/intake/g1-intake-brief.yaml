constraints:
  - The renderer must be pure and deterministic; identical inputs must produce an identical envelope.
  - The rendered envelope must be a closed set with no implicit or wildcard authority.
  - An envelope must never be ACTIVE before a validated approval from the SCRUM-186 contract is bound.
  - G2 approval is required before branch/worktree or repository implementation writes.
  - G3, G4, G5, and G6 remain separate gates.
assumptions:
  - origin/main at 54fcc4c5395d0b3dabfe0564d5b3f8ad8daa3337 is the refreshed protected-base evidence.
  - SCRUM-184 through SCRUM-189 are the declared prerequisites, with SCRUM-186 approval validation supplying the validated approval input.
  - The implementation can use the repository's existing Python standard-library and jsonschema patterns without dependency changes.
risks:
  - id: RISK-1
    description: An under-constrained envelope schema could leak implicit execution authority into G2.
    impact: high
    mitigation: Keep the schema fully closed, enumerate every scope and action set, and test later-gate exclusion invariants explicitly.
  - id: RISK-2
    description: Non-deterministic serialization would break checkpoint and replay comparison.
    impact: medium
    mitigation: Use canonical sorted-key serialization, stable collection ordering, and a replay-digest equality test.
