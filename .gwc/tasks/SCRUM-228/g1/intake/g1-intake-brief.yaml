problem:
  statement: >-
    SCRUM-228 requires a deterministic, fail-closed projection_privacy_decision
    that sanitizes an already-bounded projection payload before it can be rendered
    for DS Admin, Task Center or an external audit surface. Raw secrets,
    credentials, tokens, private keys, production data and hidden reasoning are
    rejected; approved sensitive metadata is redacted per explicit policy; raw
    protected values must never appear in output, diagnostics, redaction metadata
    or hashes.
  why_now: >-
    SCRUM-223 (source-authority-check, Done, PR #200 merged) provides the bound,
    schema-valid source-authority decision this evaluator must consume; SCRUM-227
    (evidence-linking, Done, PR #201 merged) just landed the shared family B1
    test, family validator and README, removing the integration-conflict that
    earlier held SCRUM-228's G2. SCRUM-228 now proceeds against the refreshed
    current main so its G0/G1 base bindings are exact.
desired_outcome: >-
  A pure read-only sanitizer/evaluator that validates closed classification,
  recursively detects mandatory protected keys, evaluates target policy, performs
  safe redaction/removal, scans for residual leakage and attaches order-independent
  sanitized/decision digests, never granting merge/PR/deploy authority. The shared
  node descriptor stays thin read_only metadata; the family validator/tests/README
  are extended with the static runtime mapping.
