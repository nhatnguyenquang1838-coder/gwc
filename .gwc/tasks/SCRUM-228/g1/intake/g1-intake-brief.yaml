  non_goals:
  - live DLP or secret scanner
  - connector or production-data query
  - external storage or source mutation
  - target projection or rendering
  - branch/repository/Jira write, approval, PR, merge, deploy, release
  - credential rotation or migration
constraints:
- read-only evaluation; no secret retrieval, decryption, storage, connector call, target write or policy mutation
- "fail-closed: any prohibited class, missing classification, policy denial, invalid redaction or residual leak yields a schema-valid BLOCKED artifact"
- order-independent sanitized and decision digests; any safe value/policy/revision drift changes the applicable digest
- no authority field may become true
assumptions:
- SCRUM-223 source-authority decision is schema-valid, READY and bound to the same task/repository/target at G2 execution time
- SHA-256 is the required digest algorithm for sanitized and decision digests
