    - tests/test_gate_authority_gate_transition_decision_m5.py
    - Focused unit validation and complete local diff review
  non_goals:
    - Modify the existing node descriptor or registry outside the three implementation files
    - Perform, apply, or persist a gate transition or lifecycle state change
    - Approval generation or approval token issuance
    - Any connector call from the implemented node
    - Draft PR creation, ready-for-review promotion, merge, deploy, release, migration, secrets, credentials, or production data
constraints:
  - The evaluator must be pure and replay-safe; identical inputs must produce an identical decision.
  - The decision outcome set is exactly PASS, BLOCK, CONTINUE, AWAITING_APPROVAL, and NOT_APPLICABLE.
  - The node identifies the next lifecycle node but never performs the transition.
  - The canonical transition topology is read from core/task-lifecycle/gate-transition-map.yaml and never inferred.
  - G2 approval is required before branch/worktree or repository implementation writes.
  - G3, G4, G5, and G6 remain separate gates.
assumptions:
  - origin/main at f6ef9a1ef30b40d110b4db9d34dddddb12b19c59 is the refreshed protected-base evidence.
  - SCRUM-184, SCRUM-186, SCRUM-188, SCRUM-189, and SCRUM-191 are the declared prerequisites and are satisfied at the protected base.
  - The implementation can use the repository's existing Python standard-library, PyYAML, and jsonschema patterns without dependency changes.
risks:
  - id: RISK-1
    description: A permissive transition decision could imply authority to advance a gate that was not actually satisfied.
    impact: high
    mitigation: Fail closed to BLOCK on any missing, invalid, or drifted evidence and test every outcome precedence rule explicitly.
  - id: RISK-2
    description: Divergence between the evaluator and core/task-lifecycle/gate-transition-map.yaml would produce an incorrect next node.
    impact: medium
    mitigation: Bind the evaluator to the map file as the single source of topology and test map-driven next-node resolution.
