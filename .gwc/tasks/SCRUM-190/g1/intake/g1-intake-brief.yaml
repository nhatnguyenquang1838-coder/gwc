problem:
  statement: Implement the replay-safe gate_authority.gate-transition-decision node for SCRUM-190.
  why_now: SCRUM-184, SCRUM-186, SCRUM-188, SCRUM-189, and SCRUM-191 are merged at the protected base, so the F2 authority inputs required to decide a gate transition now exist and the target node remains descriptor-only.
desired_outcome: Add the decision JSON schema, a pure replay-safe decision evaluator that identifies the next lifecycle node, and focused M5 tests that never perform a transition or grant later-gate authority.
