- consumes SCRUM-272 envelope (run-manifest fields + control-plane protected paths)
- fail closed on out-of-scope path/action, malformed output, provider timeout, duplicate/replay, unknown write
- bounded repair rounds only; each repair changes head SHA and invalidates prior evidence
assumptions:
- the SCRUM-272 manifest envelope is the binding authority source for allowed_paths / prohibited_paths / authorized_actions
- a deterministic fake provider is sufficient to prove the contract in CI (AC-1..AC-5)
- Hermes / Codex plug in later via the same Provider protocol without graph changes
