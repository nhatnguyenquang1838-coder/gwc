problem:
  statement: >-
    The autonomous pre-prod runtime (SCRUM-270/271/272) can derive a bounded G2
    envelope per task, but has no provider-neutral node to actually invoke an AI
    implementation agent for one Jira task inside that exact envelope.
  why_now: >-
    SCRUM-271 (graph/evidence) and SCRUM-272 (standing authority + run-manifest
    envelope) are Done/merged, so SCRUM-273 is now unblocked and is the next slice
    of the Autonomous Pre-Prod Runtime MVP.
desired_outcome: >-
  A fail-closed, provider-neutral ai-task-execution node that builds a typed
  instruction pack, dispatches to a pluggable provider, enforces the scope envelope,
  returns a schema-valid result, and never grants G3/G4/G5 authority.
stakeholders:
  requester: Nhat Nguyen Quang
  affected:
  - Hermes-PC
  - autonomous pre-prod runtime
  - downstream SCRUM-274/275 (task selector + branch/PR/merge nodes)
scope:
