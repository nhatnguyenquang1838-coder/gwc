  impact: medium
  mitigation: Changes are additive (ninth node + doc/integration updates); full package_export suite and family validator run before completion.
- id: RISK-2
  description: Exhaustive mapping of every upstream reason across nine nodes is large.
  impact: medium
  mitigation: A centralized decision table maps each upstream reason code to one route; fixtures assert the table for every namespace.
