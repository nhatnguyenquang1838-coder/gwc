  - .gwc/tasks/SCRUM-237/**
  non_goals:
  - repair, rebuild, retry, publish or release (recommend-only)
  - consumer repository write
  - merge, deploy or production operations
  - mutation of existing verifier internals beyond shared-validator integration
constraints:
- router recommends and records a route only; never performs the action
- never routes unsafe path, schema incompatibility, replay conflict, content/hash contradiction or authority-boundary violation to automatic success/retry without changed approved evidence
- timeout/interruption/unknown require checkpoint/readback reconciliation before retry
- same canonical failure evidence produces the same route and digest with no duplicate external/filesystem effect
- bounded retry by count/deadline with an explicitly retryable reason plus reconciled zero/known effect
- family validator must cover exactly nine nodes preserving canonical=delivery_evidence and authority_boundary=g2_required
assumptions:
- upstream reason-code namespaces from SCRUM-229-236 are stable and enumerated in the existing verifiers
- SHA-256 and the closed reason-code contract govern determinism
