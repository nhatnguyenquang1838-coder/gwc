problem:
  statement: >-
    SCRUM-237 builds the package_export.export-failure-routing evaluator for the
    F7 family (node package-export-export-failure-routing). It routes manifest,
    schema, path, build, hash and smoke failures to exactly one deterministic
    bounded next action without publishing an invalid package or repeating an
    unknown effect, and owns the final family integration of all nine nodes.
  why_now: >-
    SCRUM-236 (smoke-verification) is Done and merged (PR #216), unblocking the
    final F7 node. The family validator (tools/node_architect/validate_node_catalog_package_export.py)
    already requires exactly nine semantics including export-failure-routing, but
    no routing evaluator, node definition, README/runtime mapping or integration
    tests exist yet for this node.
desired_outcome: >-
  A pure recommend-only routing evaluator that consumes typed upstream outcomes
  and reason codes, returns exactly one of six routes (REPAIR_INPUT,
  REBUILD_STAGING, REVERIFY_READBACK, BOUNDED_RETRY, HUMAN_REQUIRED,
  FAIL_CLOSED), persists a route-decision digest with idempotency key, bounded
  retry count/deadline and prohibited actions, and is replay-safe. Plus the
  ninth node definition, README/runtime mapping and family integration tests so
  the nine-node family validator passes without implying any publish/merge/deploy
  authority.
