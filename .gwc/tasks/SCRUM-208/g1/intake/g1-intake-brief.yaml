scope:
  in_scope:
  - Add a deterministic connector-free CAS evaluator and closed result schema.
  - Integrate strict CAS context into checkpoint_store while preserving legacy callers.
  - Add replay, mismatch, lease, fencing, ownership, scope, base-drift, and idempotency
    tests.
  - Persist task-scoped G0/G1/G2 and Kiro plan artifacts.
