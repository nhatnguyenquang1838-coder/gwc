semantic_decisions:
  runtimes: [python3.9, node22]
  independence: Python and Node references never invoke each other (no shell-out) for canonicalization
  positive_coverage:
    - lexicographic key ordering (ASCII + non-BMP surrogate-pair keys)
    - ES6 shortest-round-trip number serialization (1.0->1, exponent formats, boundaries 1e-6/1e21)
    - minimal RFC-8785 string escaping (C0 controls, \\u00xx lowercase, non-ASCII literal)
    - Unicode normalization none (valid non-BMP preserved)
    - nested objects/arrays, max double, max safe integer, precision preservation
  negative_coverage:
    - negative zero (-0, -0.0, -0e5) -> DIGEST_NEGATIVE_ZERO_REJECTED
    - NaN/Infinity/-Infinity/overflow(1e400) -> DIGEST_NON_FINITE_REJECTED
    - non-string key -> DIGEST_NON_STRING_KEY_REJECTED
    - duplicate raw key -> DIGEST_DUPLICATE_RAW_KEY_REJECTED
    - unpaired/lone surrogate -> DIGEST_INVALID_UNICODE_REJECTED
    - depth > 64 and keys > 100000 -> DIGEST_RESOURCE_LIMIT_EXCEEDED
  framing_contract: sha256( u32be(utf8_len(domain_tag)) || domain_tag_utf8 || u64be(byte_len(preimage)) || preimage )
  domain: gwc.governance.evidence.canonical.v1
  envelope_binding: profile_id/hash_algorithm/domain/schema_ref/preimage_framing_scheme/hexdigest
  duplicate_key_encoding: raw lexical JSON text preserved in corpus (input_is_raw_text=true), never a YAML mapping that collapses duplicates
  canonicalization_never_grants_authority: true

