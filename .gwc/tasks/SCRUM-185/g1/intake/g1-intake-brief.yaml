constraints:
  - 'The generator must be pure and deterministic: identical inputs produce an identical approval request and command.'
  - The node must never perform, approve, or authorize the gated action it describes.
  - 'The approval token is a non-secret 64-hex request identifier bound to gate, task, scope, expiry, and head; it must not act as a bearer secret.'
  - 'The emitted command grammar must be exactly: APPROVE <GATE_SHORT> <TASK_ID> <APPROVAL_TOKEN_64HEX> <EXPIRES_AT_UTC>.'
  - G2 approval is required before branch/worktree or repository implementation writes.
  - G3, G4, G5, and G6 remain separate gates.
assumptions:
  - origin/main at 7269a5219750b7c4fa7c5229eb95df395fd4712d is the current protected-base evidence.
