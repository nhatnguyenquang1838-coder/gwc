  - SCRUM-167 remains the parent epic-level task and is not modified by this subtask.
  - The implementation can use the repository's existing Python standard-library and jsonschema patterns without dependency changes.
risks:
  - id: RISK-1
    description: A token generator at a governance authority boundary could be mistaken for an authority grant or a secret-bearing credential.
    impact: high
    mitigation: Keep the node pure, document and test non-secret semantics explicitly, and assert in tests that no output field grants or implies execution authority.
  - id: RISK-2
    description: Non-deterministic or weakly bound token derivation would break replay safety and drift detection.
    impact: high
    mitigation: Derive the token deterministically from the canonical binding tuple and add drift-sensitivity tests over gate, task, scope, expiry, and head inputs.
  - id: RISK-3
    description: Command-grammar drift would silently break downstream human approval parsing.
    impact: medium
    mitigation: Pin the exact five-token grammar in the schema and assert the rendered string byte-for-byte in the M4 tests.
