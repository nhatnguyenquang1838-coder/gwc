problem:
  statement: Implement replay-safe gate_authority.approval-command-validation for SCRUM-186 (MAT-F2-N03, M2 to M5).
  why_now: 'SCRUM-185 and SCRUM-188 are complete, so the approval request generation and authority boundary contracts now exist; the exact-command validation half of the authority chain is still missing.'
desired_outcome: Add a JSON schema, a pure Python approval-command validation module, and a focused M5 test module that validate an exact human approval response against the generated approval request and the current repo/action readback, without invoking actions or granting later-gate authority.
