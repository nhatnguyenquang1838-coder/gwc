constraints:
  - The validator must be pure and fail closed; it never performs the approved action.
  - Validation must be replay safe and enforce single consumption of an approval response.
  - Expiry and drift (scope, repo, or action readback mismatch) must be rejected.
  - The existing v1 action-authority regression suite must remain green.
  - G2 approval is required before branch or repository implementation writes.
  - G3, G4, G5, and G6 remain separate gates.
assumptions:
  - origin/main at 7269a5219750b7c4fa7c5229eb95df395fd4712d is the current protected-base evidence after SCRUM-188 merged.
  - SCRUM-185 and SCRUM-188 are the declared prerequisites and are complete.
  - The implementation can use the repository's existing Python standard-library and jsonschema patterns without dependency changes.
risks:
  - id: RISK-1
    description: Approval-command validation is a security-sensitive governance boundary; a permissive comparison would let a stale or forged approval authorize execution.
    impact: high
    mitigation: Keep the validator pure and fail closed, require exact command equality plus readback binding, and cover expiry, drift, replay, and single-consumption in explicit tests.
  - id: RISK-2
    description: Final integration touching tools/validate_gate_action.py could regress the v1 action-authority contract.
    impact: medium
    mitigation: Treat v1 edits as additive-only and last-resort, and run the existing tests/test_validate_gate_action.py suite before completion.
acceptance_criteria:
  - id: AC-1
    statement: The gate-approval-validation schema validates the complete approval-validation result shape and rejects missing or invalid bindings.
    verifiable: true
  - id: AC-2
    statement: The validator accepts only an exact human approval command that matches the generated approval request and the current repo/action readback.
    verifiable: true
  - id: AC-3
    statement: The validator rejects expired approvals and any scope, repository, or action readback drift.
    verifiable: true
  - id: AC-4
    statement: An approval response is single-consumption and any replay of a consumed or duplicated response is rejected.
    verifiable: true
  - id: AC-5
    statement: No output field grants execution, merge, deploy, or production authority, and the node performs no action.
    verifiable: true
  - id: AC-6
    statement: The focused M5 test module passes and the existing v1 action-authority regression suite stays green.
    verifiable: true
