constraints:
- target maturity M2 to M5_REPLAY_SAFE
- staging tree created before any completed output tree is exposed
- byte-exact copy in canonical entry order with source/target digest and byte count
- optional missing entries only per the accepted source decision; required missing aborts
- restart readback by idempotency key and semantic plan digest
- same key + same digest returns equivalent tree; same key + different digest fails REPLAY_CONFLICT
- no final-complete result until every copied file is read back and matches
