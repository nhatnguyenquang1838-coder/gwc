problem:
  statement: >-
    SCRUM-233 requires a deterministic, replay-safe governance-tree builder for
    the package_export node family. The generated .governance/ tree must be
    produced from an accepted source/target plan through run-scoped staging,
    byte-exact copy, full readback and idempotency-key replay semantics.
  why_now: >-
    SCRUM-231 (source-path-safety-check, PR #202 merged into main@a674d93) and
    SCRUM-232 (target-path-safety-check) are Done, so the accepted source/target
    plan that this builder consumes now exists.
desired_outcome: >-
  A deterministic tree builder that stages before exposing output, records
  source/target digests and byte counts in canonical entry order, fails closed on
  partial/divergent/stale state, and returns an equivalent tree on identical
  replay while failing REPLAY_CONFLICT on a divergent plan digest.
