    - production data / configuration / credentials / secrets / migration
    - runtime engine / scheduler / worker implementation
    - new lease store or external connector implementation
    - all-81 node catalog implementation
constraints:
  - deterministic digest for identical input
  - fail-closed on missing/ambiguous binding or unknown gate
  - no I/O side effects; pure decision function
  - replay equivalence ignores observed_at
assumptions:
  - checkpoint_store.py remains the persistence layer for lease state
  - observed lease evidence is supplied by the runtime gate-action router
  - fencing tokens are monotonic integers scoped to task/run/node
risks:
  - id: RISK-1
    description: Binding ambiguity could allow lease advancement under wrong task/scope.
    impact: high
    mitigation: Fail closed on any missing or malformed binding field and validate gate identity.
  - id: RISK-2
    description: Non-monotonic fencing tokens could allow stale worker advancement.
    impact: high
    mitigation: Emit observed_fencing_token + 1 for every ACQUIRED outcome; reject acquisition when actor token is stale.
