problem:
  statement: runtime_checkpoint.lease-acquisition currently exists only as a node descriptor and registry slot. There is no deterministic implementation, no decision schema, and no tests for competing-agent lease acquisition. Without this node, the runtime checkpoint family cannot enforce bounded work leases or monotonic fencing tokens before guarded branch or checkpoint state mutation.
  why_now: Sibling nodes checkpoint-capture and checkpoint-persist are already at M5; lease-acquisition is the remaining missing piece in the runtime_checkpoint family required for bounded G2 execution safety.
desired_outcome: Deliver a deterministic lease-acquisition decision utility that evaluates competing-lease evidence, rejects stale or mismatched-scope leases, and emits a monotonic fencing token when acquisition is allowed.
stakeholders:
  requester: Nhat Nguyen Quang
  affected:
    - GWC runtime checkpoint family
    - DWC bounded execution path
    - failure_recovery lease-expiry-recovery node
