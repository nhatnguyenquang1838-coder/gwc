  approved_scope:
    criterion: "No files added outside approved scope"
    verification: "Cross-reference against approved file list"
  unrelated_changes:
    criterion: "No modifications to unrelated code"
    verification: "Check for changes outside node-architect/package-export"
  schema_stability:
    criterion: "No schema version changes"
    verification: "Verify no version bumps in system files"
  publication:
    criterion: "No package publishing or releasing"
    verification: "Check that no release artifacts created"
  atomicity:
