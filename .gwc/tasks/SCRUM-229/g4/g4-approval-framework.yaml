  documentation:
    criterion: "Documentation is clear and complete"
    verification: "Review docstrings and comments"
  technical_debt:
    criterion: "No technical debt introduced"
    verification: "Check for code smells or shortcuts"
  performance:
    criterion: "Performance is acceptable"
    verification: "Review for unnecessary complexity or inefficiency"
  dependencies:
    criterion: "Dependencies are minimal and justified"
    verification: "Check imports and dependency usage"

