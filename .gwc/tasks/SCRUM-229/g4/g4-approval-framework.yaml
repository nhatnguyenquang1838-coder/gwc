  requirement_8: "All CI checks passing (lint, tests, validate-instructions)"
  requirement_9: "All tests passing (pytest exit code 0)"
  requirement_10: "Determinism verified (same manifest = same digest)"

review_phases:
  phase_1_schema_review:
    files:
      - "schemas/node-architect/package-export/package-manifest.schema.yaml"
      - "schemas/node-architect/package-export/package-manifest.schema.json"
    focus_areas:
      - "Schema structure and field definitions"
      - "Evidence binding completeness"
      - "Validation rules enforcement"
      - "YAML and JSON consistency"
    approval_criteria:
      - "Schema correctly defines manifest format"
      - "All required fields present and typed"
      - "Evidence binding fields complete"
      - "Unknown fields explicitly rejected"
      - "Schema is valid YAML and JSON"

  phase_2_loader_review:
    files:
      - "tools/node_architect/package_export/__init__.py"
      - "tools/node_architect/package_export/models.py"
      - "tools/node_architect/package_export/loader.py"
      - "tools/node_architect/package_export/validator.py"
      - "tools/node_architect/package_export/digest.py"
    focus_areas:
      - "Pydantic model implementation"
      - "YAML parsing robustness"
      - "Custom validator logic"
      - "Deterministic digest generation"
      - "Error handling and edge cases"
    approval_criteria:
      - "Pydantic models correctly implement schema"
      - "YAML parsing handles errors gracefully"
      - "Business logic validators work correctly"
      - "Deterministic digest (json.dumps sort_keys=True)"
      - "Preserves declared order and canonical sort"
      - "Source binding complete and correct"
      - "Reason codes properly emitted"
      - "Type hints complete and accurate"

  phase_3_fixtures_review:
    files:
      - "tests/package_export/fixtures/valid_manifest.yaml"
      - "tests/package_export/fixtures/malformed_yaml.yaml"
      - "tests/package_export/fixtures/non_object_root.yaml"
      - "tests/package_export/fixtures/missing_instructions.yaml"
      - "tests/package_export/fixtures/duplicate_entry_id.yaml"
      - "tests/package_export/fixtures/unsupported_version.yaml"
      - "tests/package_export/fixtures/unknown_field.yaml"
      - "tests/package_export/fixtures/source_sha_mismatch.yaml"
      - "tests/package_export/conftest.py"
    focus_areas:
      - "Test coverage completeness"
      - "Error scenario representation"
      - "Fixture naming and clarity"
      - "Expected outcome documentation"
    approval_criteria:
      - "8 fixtures cover all error modes"
      - "Each fixture has expected outcome documented"
      - "Valid manifest is well-formed"
      - "All error scenarios represented"
      - "Fixture data realistic and appropriate"

  phase_4_tests_review:
    files:
      - "tests/package_export/test_manifest_load.py"
      - "tests/package_export/test_determinism.py"
      - "tests/package_export/test_evidence_binding.py"
    focus_areas:
      - "Test coverage and completeness"
      - "Acceptance criteria validation"
      - "Determinism verification"
      - "Evidence binding validation"
      - "Test quality and clarity"
    approval_criteria:
      - "Happy path and error handling covered"
      - "Determinism verified (byte-for-byte consistency)"
      - "Evidence binding validated (all fields)"
      - "All 6 acceptance criteria have tests"
      - "All 7 reason codes triggered"
      - "Entry sorting verified"
      - "Tests independent and repeatable"
      - "All tests passing (exit code 0)"

  phase_5_integration_review:
    files:
      - "core/node-architect/node-catalog/package_export/package-manifest-load.node.json"
      - "core/node-architect/node-instructions/package_export/package-manifest-load.node-instruction.yaml"
      - ".gwc/tasks/SCRUM-229/node-runtime/<run-id>/<node-id>/node-result.json"
    focus_areas:
      - "Node descriptor correctness"
      - "Node instruction definition"
      - "Evidence contract compliance"
      - "Next-route decision logic"
    approval_criteria:
      - "Node descriptor binds loader correctly"
      - "Evidence contract properly defined"
      - "Node instruction specifies next-route"
      - "Evidence recording matches contract"
      - "Directory structure correct"
      - "All required fields present"

acceptance_criteria_review:
  ac_1_typed_binding:
    description: "Explicit Pydantic model fields for task, repo, path, ref, SHA, version, digest"
    verification_method: "Examine models.py for required fields"
    approval_condition: "All fields present and used correctly"
  ac_2_fixture_coverage:
    description: "8 comprehensive fixtures covering all error modes"
    verification_method: "Count fixtures and verify error coverage"
    approval_condition: "8 fixtures present, all error modes covered"
  ac_3_determinism:
    description: "Identical digest generation verified across multiple runs"
    verification_method: "Review test_determinism.py for verification logic"
    approval_condition: "Determinism verified, test results show consistency"
  ac_4_blocked_fail:
    description: "Validator rejects missing/ambiguous input before inventory generation"
    verification_method: "Examine validator.py and error handling tests"
    approval_condition: "Validator properly rejects invalid input"
  ac_5_descriptor_gates:
    description: "Node descriptor and instruction define evidence boundaries correctly"
    verification_method: "Review node descriptor and instruction files"
    approval_condition: "Evidence boundaries clearly defined"
  ac_6_tests_pass:
    description: "All tests passing with comprehensive coverage"
    verification_method: "Check test results and coverage report"
    approval_condition: "All tests pass (exit code 0), comprehensive coverage"

code_quality_review:
  code_style:
    criterion: "Code follows project style guidelines"
    verification: "Visual inspection of formatting and naming conventions"
  type_safety:
    criterion: "Type hints are complete and accurate"
    verification: "Check for type annotations on all functions/variables"
  error_handling:
