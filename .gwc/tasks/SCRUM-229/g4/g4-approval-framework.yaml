  credentials_check:
    criterion: "No hardcoded credentials or secrets"
    verification: "Grep for common secret patterns"
  input_validation:
    criterion: "Input validation prevents injection attacks"
    verification: "Review validator logic and YAML parsing"
  file_operations:
    criterion: "File operations are safe (no path traversal)"
    verification: "Check file handling code"
  yaml_safety:
    criterion: "YAML parsing is safe (no arbitrary code execution)"
    verification: "Verify use of safe_load instead of load"
  external_calls:
    criterion: "No unsafe external library calls"
    verification: "Review library usage and security advisories"

