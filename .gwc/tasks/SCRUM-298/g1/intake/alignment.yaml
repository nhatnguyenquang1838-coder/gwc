decisions:
  - reason: "Separation of concerns - intake record is normalized input, intake card is final projection after full context evaluation"
    decision: "Chose request-intake-record artifact type over extending intake-card"
  - reason: "Prevents ambiguous inputs from falling through to unintended states"
    decision: "Used fail-closed principle for all validation"
  - reason: "Ensures consistent primary reason code selection for automation"
    decision: "Deterministic reason code precedence"
  - reason: "Prevents interference with other lanes and ensures clean context"
    decision: "Isolated worktree + guarded branch only"
  - reason: "G4 remains human authority per SCRUM-289 family requirements"
    decision: "No merge/deploy authority claimed"