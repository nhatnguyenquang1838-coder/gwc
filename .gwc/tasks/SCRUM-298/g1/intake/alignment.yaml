coding_guide:
  language: python
  version: "3.11.15"
  style: |
    - Follow PEP 8 with 120 char line limit
    - Use type hints from __future__ annotations
    - Immutable data patterns where practical
    - Deterministic algorithms with sorted outputs
    - Fail-closed validation with precise reason codes
    - Canonical JSON hashing for snapshot integrity
    - No external dependencies beyond stdlib
  patterns:
    - canonical_json(): deterministic serialization
    - digest_payload(): sha256 of canonical JSON
    - _validate_*(): input validation returning reason code lists
    - normalize_*(): main transformation function
    - Deterministic reason code precedence for primary selection
  prohibited:
    - Mutable default arguments
    - Broad exception handling
    - Non-deterministic ordering (use sorted/unique)
    - External network calls during validation
    - Hardcoded SHA values (accept as parameters)

test_plan:
  unit_tests:
    - test_intake_context_request_intake_m4.py
    - test_node_catalog_intake_context.py
  integration_tests:
    - "Request-intake node artifact validation"
    - "Runtime contract binding verification"
    - "G2 execution envelope exact-SHA validation"
  test_data:
    valid_request:
      intent: "Normalize user request into typed intake record"
      outcome: "Typed intake record with structured fields"
      constraints: ["Input must be canonical request shape", "No ambiguous signals"]
      exclusions: ["Production operations", "Gate authority"]
      entry_guards: ["G0_CONTEXT", "read_only authority_boundary"]
    invalid_cases:
      - malformed_input: "missing required fields"
      - ambiguous_intent: "generic 'test' intent or missing read_only guard"
      - scope_drift: "production/deployment authority keywords"
  coverage_target: 90

