# intake_context.request-intake G1 Alignment Artifacts
# Generated during G0->G1 planning phase

objective: |
  Normalize a user/assigned-work request into a typed, bounded intake record 
  without creating execution authority. The intake node shall preserve original 
  provenance and fail closed on ambiguous or missing mandatory signals.

acceptance_criteria:
  - "Typed I/O with deterministic reason taxonomy"
  - "No fall-through on unknown/unavailable inputs"
  - "Node Instruction Contract compliance"
  - "Canonical evidence ledger maintenance"
  - "Total PASS/BLOCKED/PENDING-RETRY/HUMAN_REQUIRED routing"
  - "Replay/idempotency safety"
  - "Authority-negative tests (no implied gate authority)"

