name: Direct G4 stage-aware hotfix

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-prod
          fetch-depth: 0
      - name: Patch G4 workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/g4-g5-evidence.yml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('types: [opened, reopened, synchronize, closed]', 'types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]', 1)
          s = s.replace('''    # This check is intended to be required by branch protection. It runs on\n    # every PR update and fails before merge until the trusted receipt exists.''', '''    # Required by branch protection, but G4 is inactive while the PR is Draft.\n    # Draft G2/G3 work must not fail merely because future G4 evidence is absent.''', 1)
          s = s.replace('''      - name: Require trusted G4 authority receipt\n        uses: actions/github-script@v7''', '''      - name: Require trusted G4 authority receipt when G4 is active\n        uses: actions/github-script@v7''', 1)
          anchor = '''            if (autonomousPreprod) {\n              core.info('Standing pre-prod authority applies: human G4 receipt is not required for auto/* -> pre-prod. Human G4 remains mandatory for promotion to main.');\n              return;\n            }\n            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });\n            const receipt = comments.find((item) => item.user?.login === 'github-actions[bot]' && item.body?.includes('<!-- gwc:g4-authority-receipt '));\n            if (!receipt) {\n              core.setFailed('G4 merge is blocked: no trusted gwc:g4-authority-receipt has been published for this PR. Post the exact human approval as a PR comment and wait for the receipt workflow.');\n              return;\n            }\n            core.info(`Trusted G4 authority receipt found in comment ${receipt.id}.`);'''
          replacement = '''            if (autonomousPreprod) {\n              core.info('Standing pre-prod authority applies: human G4 receipt is not required for auto/* -> pre-prod. Human G4 remains mandatory for promotion to main.');\n              return;\n            }\n            if (pr.draft) {\n              core.info('G4 is not active while the PR is Draft; G2/G3 CI remains non-blocking.');\n              return;\n            }\n            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });\n            const receipts = comments.filter((item) => item.user?.login === 'github-actions[bot]' && item.body?.includes('<!-- gwc:g4-authority-receipt '));\n            const receipt = receipts.at(-1);\n            if (!receipt) {\n              core.setFailed('G4 merge is blocked: this PR is Ready for Review but no trusted gwc:g4-authority-receipt has been published.');\n              return;\n            }\n            const parsed = receipt.body.match(/approval_id=([^ ]+) head=([0-9a-f]{40}) scope=([0-9a-f]{16}) expires=([^ ]+) source_comment_id=(\\d+)/);\n            if (!parsed) { core.setFailed('G4 merge is blocked: trusted receipt marker is malformed.'); return; }\n            if (parsed[2] !== pr.head.sha) { core.setFailed(`G4 merge is blocked: receipt head ${parsed[2]} is stale; current head is ${pr.head.sha}.`); return; }\n            const expiresAt = new Date(parsed[4]);\n            if (!Number.isFinite(expiresAt.getTime()) || expiresAt <= new Date()) { core.setFailed('G4 merge is blocked: trusted receipt is expired or invalid.'); return; }\n            core.info(`Trusted exact-head G4 authority receipt found in comment ${receipt.id}.`);'''
          if anchor not in s:
              raise SystemExit('legacy G4 receipt block not found')
          p.write_text(s.replace(anchor, replacement, 1), encoding='utf-8')

          Path('tests/test_g4_stage_aware_semantics.py').write_text('''from pathlib import Path\n\nW = Path(".github/workflows/g4-g5-evidence.yml").read_text(encoding="utf-8")\n\ndef test_draft_is_pre_g4_and_non_blocking():\n    assert "if (pr.draft)" in W\n    assert "G4 is not active while the PR is Draft" in W\n\ndef test_stage_transitions_retrigger_check():\n    assert "ready_for_review" in W and "converted_to_draft" in W\n\ndef test_ready_without_receipt_fails_closed():\n    assert "this PR is Ready for Review but no trusted gwc:g4-authority-receipt" in W\n\ndef test_receipt_is_exact_head_and_unexpired():\n    assert "parsed[2] !== pr.head.sha" in W\n    assert "expiresAt <= new Date()" in W\n\ndef test_autonomous_preprod_bypass_preserved():\n    assert "Standing pre-prod authority applies" in W\n''', encoding='utf-8')
      - name: Self-remove bootstrap
        run: git rm .github/workflows/direct-g4-stage-aware-hotfix.yml
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/g4-g5-evidence.yml tests/test_g4_stage_aware_semantics.py
          git commit -m "fix(ci): make G4 receipt gate stage-aware"
          git push origin HEAD:pre-prod
