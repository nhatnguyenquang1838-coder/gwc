name: SCRUM-781 Fresh UR.G0 V2 Boot
on:
  push:
    branches:
      - fix/SCRUM-781-q0-fresh-20261010-r1
    paths:
      - .github/workflows/scrum781-fresh-ur-g0.yml
      - scripts/scrum781_fresh_ur_g0_boot.py
      - scripts/scrum781_fresh_taskcontroller_preflight.py
      - scripts/scrum781_fresh_g0_to_g1.py
      - scripts/scrum781_fresh_q0_mailbox.py
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: scrum781-fresh-ur-g0-r1
  cancel-in-progress: false

jobs:
  native-fresh-boot:
    name: Native UR.G0 source-bound boot
    if: github.ref_name == 'fix/SCRUM-781-q0-fresh-20261010-r1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact GWC source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JSON Schema validator
        run: python -m pip install 'jsonschema>=4,<5'

      - name: Native GWC V2 UR.G0 boot (no Executor effects)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/scrum781_fresh_ur_g0_boot.py \
            --output "$RUNNER_TEMP/scrum781-fresh-ur-g0" \
            --expected-head "$GITHUB_SHA"

      - name: Checkout exact TaskController source from DW-SuperApps
        uses: actions/checkout@v4
        with:
          repository: nhatnguyenquang1838-coder/DW-SuperApps
          ref: 43072dd240658077920dee69f23c45e5ff34d923
          path: dw-control
          persist-credentials: false

      - name: Native mailbox/v2 read-only admission and exact empty readback
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/dw-control
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/scrum781_fresh_taskcontroller_preflight.py \
            --evidence "$RUNNER_TEMP/scrum781-fresh-ur-g0/fresh-boot-evidence.json" \
            --output "$RUNNER_TEMP/scrum781-fresh-ur-g0/taskcontroller-mailbox-preflight.json" \
            --expected-gwc-head "$GITHUB_SHA" \
            --taskcontroller-source-sha 1f41967d995129dff73ce2742afb5a2102b34c36

      - name: Complete Controller-owned G0 and verify native G1
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/scrum781_fresh_g0_to_g1.py \
            --artifact-dir "$RUNNER_TEMP/scrum781-fresh-ur-g0" \
            --expected-head "$GITHUB_SHA"

      - name: Dry-run native Controller G1 and typed read-only mailbox spec
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/dw-control
        run: |
          mkdir -p "$RUNNER_TEMP/scrum781-q0-dryrun"
          cp "$RUNNER_TEMP/scrum781-fresh-ur-g0/"*.json "$RUNNER_TEMP/scrum781-q0-dryrun/"
          python scripts/scrum781_fresh_q0_mailbox.py \
            --artifact-dir "$RUNNER_TEMP/scrum781-q0-dryrun" \
            --expected-head "$GITHUB_SHA" --dry-run

      - name: Publish native fresh Controller mailbox event + exact readback
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/dw-control
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/scrum781_fresh_q0_mailbox.py \
            --artifact-dir "$RUNNER_TEMP/scrum781-fresh-ur-g0" \
            --expected-head "$GITHUB_SHA"

      - name: Upload immutable G0 evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrum781-fresh-ur-g0-evidence
          path: ${{ runner.temp }}/scrum781-fresh-ur-g0/
          retention-days: 90
          if-no-files-found: warn
