name: Node Architect shadow observer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  g3-shadow-observer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize immutable G3 shadow event
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path('.')
          def load(path):
              return json.loads((root / path).read_text(encoding='utf-8'))
          def revision(payload):
              value = payload.get('revision')
              return str(value.get('revision_id', '')) if isinstance(value, dict) else str(value or '')

          profile = load('core/node-architect/gate-node-route-profile.json')
          graph = load('core/node-architect/runtime-graph-registry.json')
          nodes = load('core/node-architect/node-registry.json')
          policy = load('core/node-architect/gate-applicability-policy-registry.json')
          scope_seed = '|'.join([
              os.environ['REPOSITORY'], os.environ['BASE_SHA'], os.environ['HEAD_SHA'], os.environ['PR_NUMBER']
          ])
          event = {
              'task_id': f"PR-{os.environ['PR_NUMBER']}",
              'run_id': f"github-{os.environ['RUN_ID']}",
              'repository': os.environ['REPOSITORY'],
              'branch': os.environ['HEAD_BRANCH'],
              'base_sha': os.environ['BASE_SHA'],
              'exact_revision': os.environ['HEAD_SHA'],
              'scope_hash': 'sha256:' + hashlib.sha256(scope_seed.encode('utf-8')).hexdigest(),
              'gate': 'G3_PR',
              'requested_action': 'ci_evidence_capture',
              'scenario': 'standard_pr_delivery',
              'profile_revision': str(profile.get('revision', '')),
              'graph_revision': revision(graph),
              'node_registry_revision': revision(nodes),
              'policy_revision': revision(policy),
              'route_graph_revision': revision(graph),
              'input_payload': {
                  'event': 'pull_request',
                  'action': os.environ['ACTION'],
                  'pull_request_number': int(os.environ['PR_NUMBER']),
              },
          }
          with open('shadow-event.json', 'w', encoding='utf-8') as handle:
              json.dump(event, handle, sort_keys=True)
          PY
      - name: Run Node Architect shadow observer
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PYTHONPATH=. python tools/node_architect/shadow_gate_observer.py shadow-event.json \
            --root . \
            --observed-revision "$HEAD_SHA" \
            --observed-repository "$REPOSITORY" \
            --observed-branch "$HEAD_BRANCH" \
            --observed-base-sha "$BASE_SHA" \
            | tee shadow-output.json
      - name: Emit append-only shadow telemetry
        run: |
          PYTHONPATH=. python tools/node_architect/shadow_telemetry_from_output.py \
            shadow-event.json shadow-output.json --ledger shadow-ledger.jsonl \
            | tee shadow-telemetry-summary.json
      - name: Upload shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-architect-shadow-${{ github.run_id }}
          path: |
            shadow-event.json
            shadow-output.json
            shadow-ledger.jsonl
            shadow-telemetry-summary.json
