name: Node Architect workflow-policy tests

on:
  pull_request:
    branches: [pre-prod]
    paths:
      - 'core/node-architect/profile-registry.json'
      - 'core/node-architect/gate-applicability-policy-registry.json'
      - 'core/node-architect/gate-node-route-profile.json'
      - 'schemas/runtime/**'
      - 'schemas/node-architect/gate-node-route-profile.schema.json'
      - 'tools/node_architect/evaluate_gate_applicability.py'
      - 'tools/node_architect/resolve_gate_node_route.py'
      - 'tests/test_workflow_profile_gate_applicability.py'
      - 'tests/test_gate_applicability_policy_contract.py'
      - '.github/workflows/node-architect-workflow-policy-tests.yml'

permissions:
  contents: read

jobs:
  workflow-policy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile workflow-policy tools
        run: python -m py_compile tools/node_architect/evaluate_gate_applicability.py tools/node_architect/resolve_gate_node_route.py
      - name: Run workflow-policy E2E contract tests
        run: python -m unittest -v tests.test_workflow_profile_gate_applicability tests.test_gate_applicability_policy_contract
