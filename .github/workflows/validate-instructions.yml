name: Validate instructions

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify drift-sensitive checksum records
        run: |
          set -o pipefail
          sha256sum AGENTS.md skills/gwc-g0/SKILL.md | tee drift-sensitive-actual.txt
          grep -E '  (AGENTS.md|skills/gwc-g0/SKILL.md)$' SHA256SUMS.txt | tee drift-sensitive-recorded.txt
          sha256sum -c drift-sensitive-recorded.txt | tee drift-sensitive-checksums.log

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate LF and UTF-8 normalization
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -o pipefail
          args=(--root . --json)
          if [[ -n "${BASE_SHA:-}" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            args+=(--changed-since "$BASE_SHA")
          fi
          python tools/validate_line_endings.py "${args[@]}" 2>&1 | tee line-ending-validation.log

      - name: Validate instruction repository
        run: |
          set -o pipefail
          python tools/validate_instructions.py 2>&1 | tee validate-instructions.log

      - name: Validate canonical runtime registries
        run: |
          set -o pipefail
          python tools/node_architect/validate_runtime_registry.py --root . 2>&1 | tee runtime-registry-validation.log

      - name: Run registry and v3 focused tests
        run: |
          set -o pipefail
          python -m unittest tests/test_runtime_registry_validation.py tests/test_v3_registry_adapter.py 2>&1 | tee runtime-registry-tests.log

      - name: Run governance unit tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p "test_*.py" 2>&1 | tee governance-unit-tests.log

      - name: Compile Python tools
        run: |
          set -o pipefail
          python -m compileall -q tools 2>&1 | tee compile-python-tools.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-${{ github.run_id }}
          path: |
            drift-sensitive-actual.txt
            drift-sensitive-recorded.txt
            drift-sensitive-checksums.log
            line-ending-validation.log
            validate-instructions.log
            runtime-registry-validation.log
            runtime-registry-tests.log
            governance-unit-tests.log
            compile-python-tools.log
          if-no-files-found: warn

      - name: Comment GWC validation result on PR
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- gwc-ci-report:validate-instructions -->';
            const status = '${{ job.status }}'.toUpperCase();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;

            async function resolveTarget() {
              if (context.payload.pull_request) {
                const pr = context.payload.pull_request;
                return {
                  issue_number: pr.number,
                  pr_number: pr.number,
                  head_sha: pr.head.sha,
                  branch: pr.head.ref,
                  event_label: 'pull_request',
                  main_sha: '',
                  workflow_commit: context.sha,
                };
              }

              if (context.eventName === 'push' && context.ref === 'refs/heads/main') {
                const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner,
                  repo,
                  commit_sha: context.sha,
                });
                const pr = associated.data.find((item) => item.merged_at) || associated.data[0];
                if (!pr) {
                  core.info(`No associated pull request found for main commit ${context.sha}; skipping PR comment.`);
                  return null;
                }
                return {
                  issue_number: pr.number,
                  pr_number: pr.number,
                  head_sha: pr.head.sha,
                  branch: pr.head.ref,
                  event_label: 'push:main',
                  main_sha: context.sha,
                  workflow_commit: context.sha,
                };
              }

              return null;
            }

            const target = await resolveTarget();
            if (!target) {
              return;
            }

            const mainCommitRow = target.main_sha ? `| Main commit | \`${target.main_sha}\` |\n` : '';
            const body = `${marker}
            ## GWC CI Report — Validate instructions

            | Field | Value |
            |---|---|
            | Status | ${status} |
            | Workflow | ${context.workflow} |
            | Event | ${target.event_label} |
            | Run | [${context.runId}](${runUrl}) |
            | PR | #${target.pr_number} |
            | Head | \`${target.head_sha}\` |
            | Branch | \`${target.branch}\` |
            ${mainCommitRow}| Commit | \`${target.workflow_commit}\` |

            _This comment is updated automatically by GitHub Actions._`;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: target.issue_number,
              per_page: 100,
            });
            const existing = comments.data.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: target.issue_number,
                body,
              });
            }
