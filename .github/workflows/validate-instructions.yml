name: Validate instructions

on:
  push:
    branches:
      - codex/gwc-cross-platform-lf-sha-normalization-20260802

permissions:
  contents: write

jobs:
  finalize-drift-checksums:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          ref: codex/gwc-cross-platform-lf-sha-normalization-20260802
          fetch-depth: 0

      - name: Refresh exact drift-sensitive checksums
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('SHA256SUMS.txt')
          replacements = {
              'AGENTS.md': 'a9ca4939b26d50b18ef9ce346f000a65de391c00e294309e16d4362d9d2111b9',
              'skills/gwc-g0/SKILL.md': '6dfa1365e4d230a002a5591534594fdf6dbddf28057879997bc2e309d4a703d6',
          }
          output = []
          seen = set()
          for line in path.read_text(encoding='utf-8').splitlines():
              if '  ' in line:
                  _, name = line.split('  ', 1)
                  if name in replacements:
                      line = f"{replacements[name]}  {name}"
                      seen.add(name)
              output.append(line)
          missing = set(replacements) - seen
          if missing:
              raise SystemExit(f"missing checksum records: {sorted(missing)}")
          path.write_text('\n'.join(output) + '\n', encoding='utf-8', newline='\n')
          PY
          sha256sum -c <(grep -E '  (AGENTS.md|skills/gwc-g0/SKILL.md)$' SHA256SUMS.txt)

      - name: Commit bounded checksum repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SHA256SUMS.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore(gwc): refresh base-drift checksum records"
          git push origin HEAD:codex/gwc-cross-platform-lf-sha-normalization-20260802
