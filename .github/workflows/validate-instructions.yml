name: Validate instructions

on:
  pull_request:
  push:
    branches:
      - main
      - pre-prod

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Hard clean the workspace (incl. untracked files) so a stale
          # releases/changelog.d/*.md left by a prior run on a reused runner
          # cannot poison the changelog-fragment hygiene validator.
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install pytest (CI-only test environment)
        # Baseline CI remediation (SCRUM-397 G2): current-main SCRUM-269
        # tests import pytest, but requirements.txt does not pin it, so the
        # governance unittest discovery step fails with ModuleNotFoundError.
        # Install pytest in the CI-only environment before discovery.
        # This does NOT modify runtime requirements.txt.
        run: python -m pip install pytest

      - name: Install cryptography (CI-only test environment)
        # Second baseline CI remediation (SCRUM-397 G2): current-main SCRUM-269
        # rev4 tests import cryptography, and the governance unittest discovery
        # step fails with ModuleNotFoundError when it is not present in the
        # runner. cryptography IS pinned in requirements.txt, but the CI-only
        # install guarantees it is available before discovery regardless of
        # cache/install-order variation. This does NOT modify requirements.txt.
        run: python -m pip install cryptography

      - name: Validate LF and UTF-8 normalization
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -o pipefail
          args=(--root . --json)
          if [[ -n "${BASE_SHA:-}" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            args+=(--changed-since "$BASE_SHA")
          fi
          python tools/validate_line_endings.py "${args[@]}" 2>&1 | tee line-ending-validation.log

      - name: Validate instruction repository
        run: |
          set -o pipefail
          python tools/validate_instructions.py 2>&1 | tee validate-instructions.log

      - name: Validate canonical runtime registries
        run: |
          set -o pipefail
          python tools/node_architect/validate_runtime_registry.py --root . 2>&1 | tee runtime-registry-validation.log

      - name: Validate runtime_checkpoint node-catalog family
        run: |
          set -o pipefail
          python tools/node_architect/validate_node_catalog_runtime_checkpoint.py 2>&1 | tee runtime-checkpoint-family-validation.log

      - name: Run runtime_checkpoint node-catalog family tests
        run: |
          set -o pipefail
          python -m unittest tests/test_node_catalog_runtime_checkpoint.py 2>&1 | tee runtime-checkpoint-family-tests.log

      - name: Run registry and v3 focused tests
        run: |
          set -o pipefail
          python -m unittest tests/test_runtime_registry_validation.py tests/test_v3_registry_adapter.py 2>&1 | tee runtime-registry-tests.log

      - name: Run governance unit tests
        run: |
          set -o pipefail
          # Defense-in-depth: never let a stray invalid changelog fragment
          # (e.g. a 'missing-task' marker leaked by a prior run) fail the
          # changelog-hygiene validator. The repo legitimately has 80+ valid
          # fragments; only synthetic leftovers should be removed.
          rm -f releases/changelog.d/*missing* releases/changelog.d/*-missing-task.md
          python -m unittest discover -s tests -p "test_*.py" 2>&1 | tee governance-unit-tests.log

      - name: Compile Python tools
        run: |
          set -o pipefail
          python -m compileall -q tools 2>&1 | tee compile-python-tools.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-${{ github.run_id }}
          path: |
            line-ending-validation.log
            validate-instructions.log
            runtime-registry-validation.log
            runtime-checkpoint-family-validation.log
            runtime-registry-tests.log
            runtime-checkpoint-family-tests.log
            governance-unit-tests.log
            compile-python-tools.log
          if-no-files-found: warn

      - name: Comment GWC validation result on PR
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- gwc-ci-report:validate-instructions -->';
            const status = '${{ job.status }}'.toUpperCase();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;

            async function resolveTarget() {
              if (context.payload.pull_request) {
                const pr = context.payload.pull_request;
                return {
                  issue_number: pr.number,
                  pr_number: pr.number,
                  head_sha: pr.head.sha,
                  branch: pr.head.ref,
                  event_label: 'pull_request',
                  target_sha: '',
                  workflow_commit: context.sha,
                };
              }

              const protectedPushRefs = ['refs/heads/main', 'refs/heads/pre-prod'];
              if (context.eventName === 'push' && protectedPushRefs.includes(context.ref)) {
                const targetBranch = context.ref.replace('refs/heads/', '');
                const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner,
                  repo,
                  commit_sha: context.sha,
                });
                const pr = associated.data.find((item) => item.merged_at) || associated.data[0];
                if (!pr) {
                  core.info(`No associated pull request found for ${targetBranch} commit ${context.sha}; skipping PR comment.`);
                  return null;
                }
                return {
                  issue_number: pr.number,
                  pr_number: pr.number,
                  head_sha: pr.head.sha,
                  branch: pr.head.ref,
                  event_label: `push:${targetBranch}`,
                  target_sha: context.sha,
                  workflow_commit: context.sha,
                };
              }

              return null;
            }

            const target = await resolveTarget();
            if (!target) {
              return;
            }

            const targetCommitRow = target.target_sha ? `| Target commit | \`${target.target_sha}\` |\n` : '';
            const body = `${marker}
            ## GWC CI Report — Validate instructions

            | Field | Value |
            |---|---|
            | Status | ${status} |
            | Workflow | ${context.workflow} |
            | Event | ${target.event_label} |
            | Run | [${context.runId}](${runUrl}) |
            | PR | #${target.pr_number} |
            | Head | \`${target.head_sha}\` |
            | Branch | \`${target.branch}\` |
            ${targetCommitRow}| Commit | \`${target.workflow_commit}\` |

            _This comment is updated automatically by GitHub Actions._`;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: target.issue_number,
              per_page: 100,
            });
            const existing = comments.data.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: target.issue_number,
                body,
              });
            }
