name: SCRUM-781 event-driven Executor dispatch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: scrum-781-event-driven-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.head_ref == 'ops/SCRUM-781-g2-approval-request-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout transport runner
        uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false

      - name: Checkout canonical TaskController release
        uses: actions/checkout@v4
        with:
          repository: nhatnguyenquang1838-coder/DW-SuperApps
          ref: 75404cfeb57f6742b60f9136aeeefd41c66b5eef
          path: dw-superapps
          persist-credentials: false

      - name: Checkout exact SCRUM-781 execution source
        uses: actions/checkout@v4
        with:
          repository: nhatnguyenquang1838-coder/gwc
          ref: f6fd4121e492b61e8e0781614cd4b627d99ad979
          path: canonical-gwc
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install TaskController dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dw-superapps/requirements-dev.txt

      - name: Canonically redispatch E9 as event-driven execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/dw-superapps
        run: python transport/.github/scripts/scrum781_e9_event_redispatch.py
