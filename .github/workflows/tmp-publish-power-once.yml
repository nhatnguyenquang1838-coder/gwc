name: Publish GWC Power once
# publication-trigger: 1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-publish-power-once.yml

permissions:
  contents: write

jobs:
  publish:
    uses: nhatnguyenquang1838-coder/DW-SuperApps/.github/workflows/reusable-publish-power.yml@4e552ea3d915a4790814b08b3155c66e3c5736a1
    with:
      power_id: gwc
      recipe_path: distribution/power-package.yaml
      package_version: main-20260725.1-62689ce
      foundation_ref: 4e552ea3d915a4790814b08b3155c66e3c5736a1
      source_date_epoch: 0
      distribution_branch: power-dist
      publish_release: true
      publish_distribution_branch: true
    secrets: inherit

  cleanup:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - name: Remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-publish-power-once.yml
          git commit -m "chore(power): remove one-time GWC publication workflow"
          git push origin HEAD:main
