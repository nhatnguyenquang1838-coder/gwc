name: Cross-platform LF and SHA parity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculate-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate LF and UTF-8 normalization
        shell: bash
        run: |
          set -o pipefail
          python tools/validate_line_endings.py --root . --json 2>&1 | tee line-ending-validation.log

      - name: Calculate parity hashes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          targets = [
              Path("core/Coding_Project_Governance_v1.0.md"),
              Path("core/CROSS_PLATFORM_TEXT_NORMALIZATION_RULE_v1.0.md"),
              Path("projects/gwc/package.yaml"),
          ]
          payload = {
              "runner_os": os.environ["RUNNER_OS"],
              "hashes": {
                  path.as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in targets
              },
          }
          output = Path(f"cross-os-sha-parity-{os.environ['RUNNER_OS']}.json")
          output.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Upload parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: lf-sha-parity-${{ runner.os }}-${{ github.run_id }}
          path: |
            line-ending-validation.log
            cross-os-sha-parity-${{ runner.os }}.json

  compare-parity:
    needs: calculate-parity
    runs-on: ubuntu-latest
    steps:
      - name: Download parity evidence
        uses: actions/download-artifact@v4
        with:
          pattern: lf-sha-parity-*-${{ github.run_id }}
          path: parity-artifacts

      - name: Compare hashes across operating systems
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = sorted(Path("parity-artifacts").rglob("cross-os-sha-parity-*.json"))
          if len(reports) != 3:
              raise SystemExit(f"expected 3 parity reports, found {len(reports)}")

          payloads = [json.loads(path.read_text(encoding="utf-8")) for path in reports]
          baseline = payloads[0]["hashes"]
          mismatches = {
              payload["runner_os"]: payload["hashes"]
              for payload in payloads[1:]
              if payload["hashes"] != baseline
          }
          if mismatches:
              raise SystemExit(f"CROSS_OS_HASH_MISMATCH: {mismatches}")

          print("PASS: canonical hashes are identical across Linux, macOS, and Windows")
          PY
