name: Cross-platform LF and SHA parity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-package-sha:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/gwc-cross-platform-lf-sha-normalization-20260802'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Materialize package and SHA closure
        env:
          FINAL_WORKFLOW_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import os

          entries = [
              '  - {id: cross-platform-text-normalization-rule, path: core/CROSS_PLATFORM_TEXT_NORMALIZATION_RULE_v1.0.md, target: .governance/CROSS_PLATFORM_TEXT_NORMALIZATION_RULE_v1.0.md, required: true}',
              '  - {id: repository-gitattributes, path: .gitattributes, target: .governance/repository-controls/.gitattributes, required: true}',
              '  - {id: repository-editorconfig, path: .editorconfig, target: .governance/repository-controls/.editorconfig, required: true}',
              '  - {id: line-ending-validator, path: tools/validate_line_endings.py, target: .governance/tools/validate_line_endings.py, required: true}',
              '  - {id: line-ending-policy-tests, path: tests/test_line_ending_policy.py, target: .governance/tests/test_line_ending_policy.py, required: true}',
              '  - {id: line-ending-parity-workflow, path: .github/workflows/line-ending-parity.yml, target: .governance/workflows/line-ending-parity.yml, required: true}',
              '  - {id: validate-instructions-workflow, path: .github/workflows/validate-instructions.yml, target: .governance/workflows/validate-instructions.yml, required: true}',
          ]
          package = Path('projects/gwc/package.yaml')
          package_text = package.read_text(encoding='utf-8')
          if 'cross-platform-text-normalization-rule' not in package_text:
              package_text = package_text.replace('instructions:\n', 'instructions:\n' + '\n'.join(entries) + '\n', 1)
              package.write_text(package_text, encoding='utf-8', newline='\n')

          final_workflow = base64.b64decode(os.environ['FINAL_WORKFLOW_B64'])
          changed = [
              '.editorconfig',
              '.gitattributes',
              '.github/workflows/line-ending-parity.yml',
              '.github/workflows/validate-instructions.yml',
              'core/CROSS_PLATFORM_TEXT_NORMALIZATION_RULE_v1.0.md',
              'projects/gwc/package.yaml',
              'releases/changelog.d/2026-08-02-cross-platform-lf-normalization.md',
              'tests/test_line_ending_policy.py',
              'tools/validate_line_endings.py',
          ]
          sums = Path('SHA256SUMS.txt')
          lines = sums.read_text(encoding='utf-8').splitlines()
          index = {line.split('  ', 1)[1]: i for i, line in enumerate(lines) if '  ' in line}
          for relative in changed:
              data = final_workflow if relative == '.github/workflows/line-ending-parity.yml' else Path(relative).read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              record = f'{digest}  {relative}'
              if relative in index:
                  lines[index[relative]] = record
              else:
                  inserted = False
                  for i, line in enumerate(lines):
                      path = line.split('  ', 1)[1] if '  ' in line else ''
                      if path > relative:
                          lines.insert(i, record)
                          inserted = True
                          break
                  if not inserted:
                      lines.append(record)
                  index = {line.split('  ', 1)[1]: i for i, line in enumerate(lines) if '  ' in line}
          sums.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Validate finalized package and checksums
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          python tools/validate_line_endings.py --root . --json --changed-since "$BASE_SHA"
          python -m unittest tests/test_line_ending_policy.py -v
          python tools/build_project_package.py gwc --output dist --clean
          git diff --check

      - name: Commit finalized package and checksums
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/gwc/package.yaml SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "No finalization changes required."
            exit 0
          fi
          git commit -m "chore(gwc): finalize LF package and SHA closure"
          git push origin HEAD:${{ github.head_ref }}
          git rev-parse HEAD | tee finalized-head.txt

      - name: Upload finalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf-package-sha-finalization-${{ github.run_id }}
          include-hidden-files: true
          path: |
            finalized-head.txt
            projects/gwc/package.yaml
            SHA256SUMS.txt
