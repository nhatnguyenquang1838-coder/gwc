name: Build instruction packages

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - gwc
          - ds-mcp
          - rental-home
          - pm-skills
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate
        run: python tools/validate_instructions.py --project "${{ matrix.project }}"

      - name: Build package
        run: python tools/build_project_package.py "${{ matrix.project }}" --output dist --clean

      - name: Upload package artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instruction-package-${{ matrix.project }}
          path: dist/${{ matrix.project }}/
          if-no-files-found: error

      - name: Comment GWC package result on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const project = '${{ matrix.project }}';
            const marker = `<!-- gwc-ci-report:build-packages:${project} -->`;
            const status = '${{ job.status }}'.toUpperCase();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const pr = context.payload.pull_request;
            const body = `${marker}
            ## GWC CI Report — Build instruction package: ${project}

            | Field | Value |
            |---|---|
            | Status | ${status} |
            | Project | \`${project}\` |
            | Workflow | ${context.workflow} |
            | Run | [${context.runId}](${runUrl}) |
            | PR | #${context.issue.number} |
            | Head | \`${pr.head.sha}\` |
            | Branch | \`${pr.head.ref}\` |
            | Commit | \`${context.sha}\` |

            _This comment is updated automatically by GitHub Actions._`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.data.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
