name: Build instruction packages

on:
  pull_request:
  push:
    branches:
      - main
      - pre-prod
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - gwc
          - ds-mcp
          - rental-home
          - pm-skills
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate
        run: python tools/validate_instructions.py --project "${{ matrix.project }}"

      - name: Build package
        run: python tools/build_project_package.py "${{ matrix.project }}" --output dist --clean

      - name: Upload package artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instruction-package-${{ matrix.project }}
          path: dist/${{ matrix.project }}/
          if-no-files-found: error

      - name: Comment GWC package result on PR
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
        uses: actions/github-script@v7
        with:
          script: |
            const project = '${{ matrix.project }}';
            const marker = `<!-- gwc-ci-report:build-packages:${project} -->`;
            const status = '${{ job.status }}'.toUpperCase();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;

            async function resolveTarget() {
              if (context.payload.pull_request) {
                const pr = context.payload.pull_request;
                return {
                  issue_number: pr.number,
                  pr_number: pr.number,
                  head_sha: pr.head.sha,
                  branch: pr.head.ref,
                  event_label: 'pull_request',
                  target_sha: '',
                  workflow_commit: context.sha,
                };
              }

              const protectedPushRefs = ['refs/heads/main', 'refs/heads/pre-prod'];
              if (context.eventName === 'push' && protectedPushRefs.includes(context.ref)) {
                const targetBranch = context.ref.replace('refs/heads/', '');
                const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner,
                  repo,
                  commit_sha: context.sha,
                });
                const pr = associated.data.find((item) => item.merged_at) || associated.data[0];
                if (!pr) {
                  core.info(`No associated pull request found for ${targetBranch} commit ${context.sha}; skipping PR comment.`);
                  return null;
                }
                return {
                  issue_number: pr.number,
                  pr_number: pr.number,
                  head_sha: pr.head.sha,
                  branch: pr.head.ref,
                  event_label: `push:${targetBranch}`,
                  target_sha: context.sha,
                  workflow_commit: context.sha,
                };
              }

              return null;
            }

            const target = await resolveTarget();
            if (!target) {
              return;
            }

            const targetCommitRow = target.target_sha ? `| Target commit | \`${target.target_sha}\` |\n` : '';
            const body = `${marker}
            ## GWC CI Report — Build instruction package: ${project}

            | Field | Value |
            |---|---|
            | Status | ${status} |
            | Project | \`${project}\` |
            | Workflow | ${context.workflow} |
            | Event | ${target.event_label} |
            | Run | [${context.runId}](${runUrl}) |
            | PR | #${target.pr_number} |
            | Head | \`${target.head_sha}\` |
            | Branch | \`${target.branch}\` |
            ${targetCommitRow}| Commit | \`${target.workflow_commit}\` |

            _This comment is updated automatically by GitHub Actions._`;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: target.issue_number,
              per_page: 100,
            });
            const existing = comments.data.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: target.issue_number,
                body,
              });
            }
