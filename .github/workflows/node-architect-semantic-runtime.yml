name: Node Architect semantic runtime

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  semantic-runtime-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run semantic runtime corrective regression tests
        id: semantic_tests
        shell: bash
        run: |
          set +e
          python -m pytest -vv tests/test_scrum_566_semantic_runtime_correction.py > semantic-runtime-pytest.txt 2>&1
          status=$?
          cat semantic-runtime-pytest.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload semantic runtime test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-runtime-test-output-${{ github.run_id }}
          path: semantic-runtime-pytest.txt
      - name: Enforce semantic runtime test result
        if: steps.semantic_tests.outputs.exit_code != '0'
        run: exit 1
