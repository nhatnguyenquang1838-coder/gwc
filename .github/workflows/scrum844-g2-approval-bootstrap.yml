name: SCRUM-844 G2 approval bootstrap regression

on:
  pull_request:
    paths:
      - 'tools/node_architect/g2_approval_preparation.py'
      - 'tools/node_architect/gate_state_resolution.py'
      - 'tools/node_architect/authority_boundary_check.py'
      - 'tools/node_architect/g2_execution_envelope_render.py'
      - 'tests/test_scrum844_g2_approval_preparation.py'
      - '.github/workflows/scrum844-g2-approval-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g2-approval-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest==8.3.5 jsonschema==4.25.1 PyYAML==6.0.2
      - name: Run real source bound approval preparation and upstream regressions
        run: |
          python -m pytest -q \
            tests/test_scrum844_g2_approval_preparation.py \
            tests/test_gate_authority_authority_boundary_check_m5.py \
            tests/test_gate_authority_gate_state_resolution_m5.py \
            tests/test_gate_authority_evidence_artifact_map_m4.py \
            tests/test_gate_authority_approval_token_generation_m4.py \
            tests/test_gate_authority_g2_execution_envelope_render_m5.py \
            tests/test_intake_context_risk_classification.py \
            tests/test_intake_context_protected_base_capture.py
