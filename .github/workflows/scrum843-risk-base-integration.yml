name: SCRUM-843 protected-base risk integration

on:
  pull_request:
    paths:
      - 'tools/node_architect/risk_classification.py'
      - 'tools/node_architect/protected_base_capture.py'
      - 'tests/test_intake_context_risk_classification.py'
      - 'tests/test_intake_context_protected_base_capture.py'
      - '.github/workflows/scrum843-risk-base-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  risk-producer-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest==8.3.5 jsonschema==4.25.1
      - name: Run exact producer-to-consumer risk regression
        run: |
          python -m pytest -q \
            tests/test_intake_context_risk_classification.py \
            tests/test_intake_context_protected_base_capture.py
