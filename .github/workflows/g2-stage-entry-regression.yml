name: G2 stage-aware activation regression

on:
  pull_request:
    paths:
      - 'tools/node_architect/gate_state_resolution.py'
      - 'tools/node_architect/evidence_artifact_map.py'
      - 'tests/test_gate_authority_gate_state_resolution_m5.py'
      - '.github/workflows/g2-stage-entry-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-stage-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5 jsonschema==4.25.1 PyYAML==6.0.2
      - name: Scoped G2 and full-lifecycle fail-closed regressions
        run: |
          python -m pytest -q \
            tests/test_gate_authority_gate_state_resolution_m5.py \
            tests/test_gate_authority_evidence_artifact_map_m4.py \
            tests/test_gate_authority_g2_execution_envelope_render_m5.py \
            tests/test_scrum844_g2_approval_preparation.py
