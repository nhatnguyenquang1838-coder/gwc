name: SCRUM-841 G2 activation binding regression

on:
  pull_request:
    paths:
      - 'tools/node_architect/approval_command_validation.py'
      - 'schemas/gate-approval-validation.schema.json'
      - 'tests/test_gate_authority_approval_command_validation_m5.py'
      - '.github/workflows/scrum841-g2-activation-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-real-command-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5 jsonschema==4.25.1 PyYAML==6.0.2
      - name: Validate human-command, replay, schema, renderer negatives
        run: |
          python -m pytest -q \
            tests/test_gate_authority_approval_command_validation_m5.py \
            tests/test_gate_authority_g2_execution_envelope_render_m5.py \
            tests/test_gate_authority_m5_family_flow.py \
            tests/test_scrum844_g2_approval_preparation.py
