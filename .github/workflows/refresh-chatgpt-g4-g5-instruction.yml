name: Refresh ChatGPT G4 G5 instruction

on:
  push:
    branches:
      - codex/hotfix-g3-code-review-ready-transition-20260801

permissions:
  contents: write

concurrency:
  group: refresh-chatgpt-g4-g5-instruction
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hotfix-g3-code-review-ready-transition-20260801
          fetch-depth: 0

      - name: Append permanent G4 G5 instruction and regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          instruction_path = Path("agents/chatgpt-agent/agent-instructions.md")
          instruction = instruction_path.read_text(encoding="utf-8")
          marker = "## G4/G5 GitHub evidence flow"
          section = r'''

## G4/G5 GitHub evidence flow

When `.github/workflows/g4-g5-evidence.yml` exists, ChatGPT-style agents must
use the repository event chain below rather than inventing conversation-local
evidence:

```text
G3 exact-head PASS and Ready-for-Review readback
-> exact human G4 PR comment
-> validated G4 authority Actions artifact
-> sanitized `gwc:g4-authority-receipt` PR comment
-> separately authorized merge action
-> GitHub `pull_request.closed` event with `merged=true`
-> G4 merge-proof Actions artifact
-> `gwc:g4-merge-proof` PR comment
-> exact merge-SHA required workflows on `main`
-> canonical G5 Actions artifact
-> `gwc:g5-status` PR trace comment
-> optional Jira/Slack projections
```

### G4 authority handling

The only executable G4 authority source is the original human PR comment in the
exact format:

```text
APPROVE G4 <approval_id> <scope_hash_16> <expires_at_utc>
```

Before using it, verify that the PR is open, no longer Draft, the commenter has
repository write/maintain/admin authority, the command is unexpired, and the
approved head equals the current PR head. The bot-generated
`gwc:g4-authority-receipt` comment and its GitHub Actions artifact are receipts
only; they never create authority and never authorize G5 manual actions.

The evidence workflow must not merge the PR. Merge remains a separate
write-capable action and must use the current exact approved head SHA. After a
successful merge, the GitHub `pull_request.closed` event with `merged=true` is
the source for `gwc:g4-merge-proof`. If approved head and merged head differ,
the evidence chain is stale and fails closed.

### G5 post-merge handling

G5 status verification starts only after a merge commit exists. G4 authority or
merge proof alone never satisfies G5. Resolve the required `push` workflows on
`main` for the exact merge commit SHA and classify only as:

```text
success
failure
CI_PENDING
CONNECTOR_OBSERVABILITY_INCOMPLETE
SHA_MISMATCH
```

The canonical machine evidence is the GitHub Actions artifact produced by the
G4/G5 evidence workflow. The `gwc:g5-status` PR comment is human traceability
only. Jira and Slack are `projection_only` and cannot replace the human G4
comment, GitHub merge event, exact-SHA workflow evidence, or Actions artifact.

Do not commit post-merge evidence back to the merged branch and do not create a
recursive evidence PR. In `chat_connector_only`, inspect the PR comments,
workflow runs, jobs, and artifacts through GitHub connector readback. Never
fabricate a G5 comment or PASS when the PR is still Draft/unmerged, required
workflows are non-terminal, or the exact merge-SHA evidence chain is absent.
'''
          if marker not in instruction:
              instruction_path.write_text(instruction.rstrip() + section + "\n", encoding="utf-8")

          test_path = Path("tests/test_g4_g5_evidence_workflow.py")
          test = test_path.read_text(encoding="utf-8")
          if 'AGENT_INSTRUCTIONS = ROOT / "agents" / "chatgpt-agent" / "agent-instructions.md"' not in test:
              test = test.replace(
                  'WORKFLOW = ROOT / ".github" / "workflows" / "g4-g5-evidence.yml"\n',
                  'WORKFLOW = ROOT / ".github" / "workflows" / "g4-g5-evidence.yml"\n'
                  'AGENT_INSTRUCTIONS = ROOT / "agents" / "chatgpt-agent" / "agent-instructions.md"\n',
              )
          test_marker = "    def test_agent_instruction_materializes_full_g4_g5_flow(self) -> None:\n"
          if test_marker not in test:
              insertion = r'''
    def test_agent_instruction_materializes_full_g4_g5_flow(self) -> None:
        text = AGENT_INSTRUCTIONS.read_text(encoding="utf-8")
        for marker in (
            "G4/G5 GitHub evidence flow",
            "APPROVE G4 <approval_id> <scope_hash_16> <expires_at_utc>",
            "gwc:g4-authority-receipt",
            "pull_request.closed",
            "gwc:g4-merge-proof",
            "gwc:g5-status",
            "github_actions_artifact",
            "projection_only",
            "recursive evidence PR",
        ):
            self.assertIn(marker, text)
        self.assertIn("The evidence workflow must not merge the PR", text)
        self.assertIn("G4 authority or merge proof alone never satisfies G5", text)

'''
              test = test.replace('\n\nif __name__ == "__main__":\n', '\n' + insertion + '\nif __name__ == "__main__":\n')
          test_path.write_text(test, encoding="utf-8")

          changelog_path = Path("releases/changelog.d/2026-08-01-hotfix-g3-code-review-ready-transition.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          changelog_marker = "- Materialize the complete G4-to-G5 GitHub evidence chain"
          if changelog_marker not in changelog:
              changelog = changelog.rstrip() + "\n" + "\n".join([
                  changelog_marker + " through PR comments, merge-event proof, exact merge-SHA workflow evidence, and canonical Actions artifacts.",
                  "- Define the permanent ChatGPT agent behavior for `gwc:g4-authority-receipt`, `gwc:g4-merge-proof`, and `gwc:g5-status` readback.",
                  "- Keep Jira and Slack projection-only and prohibit recursive evidence commits or evidence PRs.",
              ]) + "\n"
              changelog_path.write_text(changelog, encoding="utf-8")
          PY

      - name: Commit instruction refresh
        run: |
          if git diff --quiet -- agents/chatgpt-agent/agent-instructions.md tests/test_g4_g5_evidence_workflow.py releases/changelog.d/2026-08-01-hotfix-g3-code-review-ready-transition.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/chatgpt-agent/agent-instructions.md tests/test_g4_g5_evidence_workflow.py releases/changelog.d/2026-08-01-hotfix-g3-code-review-ready-transition.md
          git commit -m "docs(g4-g5): materialize full ChatGPT evidence flow"
          git push origin HEAD:codex/hotfix-g3-code-review-ready-transition-20260801
