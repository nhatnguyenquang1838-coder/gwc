name: Publish GWC Power

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Immutable package version.
        required: true
        type: string
      publish_release:
        description: Publish a GitHub Release after validation.
        required: false
        default: false
        type: boolean
      publish_distribution_branch:
        description: Update the power-dist branch after validation.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  package:
    uses: nhatnguyenquang1838-coder/DW-SuperApps/.github/workflows/reusable-publish-power.yml@4e552ea3d915a4790814b08b3155c66e3c5736a1
    with:
      power_id: gwc
      recipe_path: distribution/power-package.yaml
      package_version: ${{ inputs.package_version }}
      foundation_ref: 4e552ea3d915a4790814b08b3155c66e3c5736a1
      source_date_epoch: 0
      distribution_branch: power-dist
      publish_release: ${{ inputs.publish_release }}
      publish_distribution_branch: ${{ inputs.publish_distribution_branch }}
    secrets: inherit
