name: Publish GWC Power

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Optional immutable package version override.
        required: false
        default: ""
        type: string
      publish_release:
        description: Publish a GitHub Release after validation.
        required: false
        default: false
        type: boolean
      publish_distribution_branch:
        description: Update the power-dist branch after validation.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  package:
    uses: nhatnguyenquang1838-coder/DW-SuperApps/.github/workflows/reusable-publish-power.yml@299cd605899467377cd31651b27d31c3f88db759
    with:
      power_id: gwc
      recipe_path: distribution/power-package.yaml
      package_version: ${{ github.event.inputs.package_version || format('gwc-main-{0}-{1}', github.run_number, github.sha) }}
      foundation_ref: 299cd605899467377cd31651b27d31c3f88db759
      source_date_epoch: 0
      distribution_branch: power-dist
      publish_release: ${{ github.event.inputs.publish_release == 'true' }}
      publish_distribution_branch: ${{ github.event.inputs.publish_distribution_branch == 'true' }}
    secrets: inherit
