schema_version: '1.0'
artifact_type: node-instruction
gate:
- G5_DEPLOY
node_id: scale_control.previous-batch-g5-verification
purpose: >-
  Bind the next batch admission decision to successful post-merge validation
  evidence for the exact previous merge commit: reject the dependent rollout
  when the previous PR is not merged, the evidence head SHA does not match the
  exact expected merge SHA, the evidence event is not a push, the evidence
  branch is not main, G5 evidence is stale or not successful, the connector
  evidence is incomplete, the human-observed label mismatches, or the human
  attestation is missing -- without partial admission and never granting task
  or gate authority.
entry_conditions:
- GWC boot completed
- agent task claim read back
- G0 and G1 evidence loaded
- exact pre-prod base/head SHA read back
- previous PR number and merge state read back
- exact expected merge SHA read back
- G5 evidence read back (source, event, branch, head SHA, run id, conclusion, connector status)
inputs:
- task_identity
- repository
- branch
- base_sha
- head_sha
- previous_batch_id
- previous_pr_number
- previous_pr_state
- expected_merge_sha
- evidence_source
- evidence_event
- evidence_branch
- evidence_head_sha
- workflow_run_id
- conclusion
- connector_status
- required_workflow_names
- observed_at_evidence
- now_at
- max_evidence_age_seconds
- human_attestation_id
allowed_actions:
- evaluate_previous_pr_state
- verify_g5_evidence_head_sha
- evaluate_g5_evidence_event
- evaluate_g5_evidence_branch
- evaluate_g5_evidence_age
- evaluate_g5_conclusion
- evaluate_connector_evidence
- evaluate_human_observed_label
- evaluate_human_attestation
- decide_previous_batch_g5_verification
- emit_previous_batch_g5_decision
forbidden_actions:
- grant_gate_authority
- grant_g2_authority
- grant_g3_authority
- merge
- auto_merge
- deploy
- redeploy
- release
- publish
- runtime_reload
- production_configuration
- production_data
- credential_change
- secret_change
- migration
- force_push
- branch_deletion
- history_rewrite
- pr_base_change
outputs:
- verification_passed
- connector_confirmed_pass
- human_observed_success
- pr_only_evidence_accepted
- evidence_age_seconds
- reason_code
- decision_digest
evidence_required:
- node-start
- node-decision
- node-result
- node-readback
- checkpoint
- runtime-event
- next-route-decision
logs_required:
- runtime-events.jsonl
- decision_digest
- state_digest
- event_digest
next:
  pass:
    disposition: continue
    reason: Previous-batch G5 evidence confirmed; proceed to the dependent batch admission through the canonical active-lane route.
    next_node: null
    next_action: proceed_to_dependent_batch_admission
    next_gate: null
  blocked:
    disposition: stop
    reason: Fail closed and report the stable G5 evidence blocker without invoking later effects.
    next_node: null
    next_action: stop_and_report_blocker
    next_gate: null
  pending:
    disposition: wait
    reason: Persist a checkpoint and reconcile the pending G5 evidence state before continuation.
    next_node: null
    next_action: persist_checkpoint_and_wait
    next_gate: null
  retry:
    disposition: retry
    reason: Replay only after idempotency and readback reconciliation pass.
    next_node: null
    next_action: reconcile_then_retry
    next_gate: null
retry:
  idempotency_key_fields:
  - task_id
  - previous_batch_id
  - head_sha
  replay_check: >-
    Read canonical node evidence and re-evaluate deterministic previous-PR
    state, G5 head-SHA binding, evidence event/branch, G5 age, conclusion, and
    connector/human-observed qualification before repeating the verification.
  max_attempts: 3
  pending_reconciliation: >-
    Unknown or pending G5 evidence state must route to checkpoint/reconciliation;
    never repeat blindly.
rollback:
  reversible: true
  strategy: >-
    Previous-batch G5 verification decisions are advisory gate controls; restore
    only reversible task-scoped effects and re-read active-lane ordering.
  reconciliation: Record rollback or no-op readback in the canonical node evidence ledger.
  human_required_when:
  - scope drift
  - authority mismatch
  - unknown external effect
  - irreversible effect
authority_boundary:
  statement: >-
    Node instructions constrain previous-batch G5 verification and do not grant
    G2, G3, G4, G5, or G6 authority, task authority, or gate authority.
  node_grants_gate_authority: false
  g2_authority_granted: false
  g3_authority_granted: false
  merge_authority_granted: false
  deployment_authority_granted: false
  production_authority_granted: false
mode_policy:
  supported_modes:
  - normal
  - fastlane
  - e2e
  - hotfix
  - rescue
  runtime_required: true
  boot_required: true
  claim_required: true
  gate_authority_required: true
  route_required: true
  instruction_required: true
  evidence_required: true
  logs_required: true
  next_route_required: true
