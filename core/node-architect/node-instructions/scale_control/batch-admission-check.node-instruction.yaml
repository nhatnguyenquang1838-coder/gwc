schema_version: '1.0'
artifact_type: node-instruction
gate:
- G3_PR
node_id: scale_control.batch-admission-check
purpose: >-
  Enforce deterministic, fail-closed batch admission for the scale_control
  family: reject a catalog batch when the previous-batch merge SHA does not
  match G5 evidence, G5 CI is not successful or unqualified, G5 evidence is
  stale, an active blocker is present, the requested node count exceeds the
  approved budget, or identity/SHA binding is invalid -- without partial
  admission and never granting task or gate authority.
entry_conditions:
- GWC boot completed
- agent task claim read back
- G0 and G1 evidence loaded
- exact pre-prod base/head SHA read back
- previous batch merge SHA read back
- G5 CI evidence read back
inputs:
- task_identity
- repository
- branch
- base_sha
- head_sha
- previous_batch_id
- previous_merge_sha
- g5_evidence_merge_sha
- g5_status
- g5_evidence_qualified
- g5_observed_at
- now_at
- max_evidence_age_seconds
- blocker_status
- requested_node_count
- approved_node_budget
allowed_actions:
- evaluate_previous_batch_merge
- verify_g5_ci_status
- evaluate_g5_evidence_qualification
- evaluate_g5_evidence_age
- evaluate_blocker_status
- evaluate_node_budget
- decide_batch_admission
- emit_batch_admission_decision
forbidden_actions:
- grant_gate_authority
- grant_g2_authority
- grant_g3_authority
- merge
- auto_merge
- deploy
- redeploy
- release
- publish
- runtime_reload
- production_configuration
- production_data
- credential_change
- secret_change
- migration
- force_push
- branch_deletion
- history_rewrite
- pr_base_change
outputs:
- admission_allowed
- partial_admission_allowed
- evidence_age_seconds
- reason_code
- decision_digest
evidence_required:
- node-start
- node-decision
- node-result
- node-readback
- checkpoint
- runtime-event
- next-route-decision
logs_required:
- runtime-events.jsonl
- decision_digest
- state_digest
- event_digest
next:
  pass:
    disposition: continue
    reason: Batch admission requirements satisfied; proceed to G3 PR creation only through the canonical active-lane route.
    next_node: null
    next_action: proceed_to_g3_pr_creation
    next_gate: null
  blocked:
    disposition: stop
    reason: Fail closed and report the stable admission blocker without invoking later effects.
    next_node: null
    next_action: stop_and_report_blocker
    next_gate: null
  pending:
    disposition: wait
    reason: Persist a checkpoint and reconcile the pending admission state before continuation.
    next_node: null
    next_action: persist_checkpoint_and_wait
    next_gate: null
  retry:
    disposition: retry
    reason: Replay only after idempotency and readback reconciliation pass.
    next_node: null
    next_action: reconcile_then_retry
    next_gate: null
retry:
  idempotency_key_fields:
  - task_id
  - previous_batch_id
  - head_sha
  replay_check: >-
    Read canonical node evidence and re-evaluate deterministic previous-batch
    merge, G5 CI, blocker, and node-budget inputs before repeating the
    admission decision.
  max_attempts: 3
  pending_reconciliation: >-
    Unknown or pending admission state must route to checkpoint/reconciliation;
    never repeat blindly.
rollback:
  reversible: true
  strategy: >-
    Batch-admission decisions are advisory gate controls; restore only
    reversible task-scoped effects and re-read active-lane ordering.
  reconciliation: Record rollback or no-op readback in the canonical node evidence ledger.
  human_required_when:
  - scope drift
  - authority mismatch
  - unknown external effect
  - irreversible effect
authority_boundary:
  statement: >-
    Node instructions constrain batch admission and do not grant G2, G3, G4,
    G5, or G6 authority, task authority, or gate authority.
  node_grants_gate_authority: false
  g2_authority_granted: false
  g3_authority_granted: false
  merge_authority_granted: false
  deployment_authority_granted: false
  production_authority_granted: false
mode_policy:
  supported_modes:
  - normal
  - fastlane
  - e2e
  - hotfix
  - rescue
  runtime_required: true
  boot_required: true
  claim_required: true
  gate_authority_required: true
  route_required: true
  instruction_required: true
  evidence_required: true
  logs_required: true
  next_route_required: true
