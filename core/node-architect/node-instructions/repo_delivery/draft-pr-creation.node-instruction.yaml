schema_version: '1.0'
artifact_type: node-instruction
node_id: repo_delivery.draft-pr-creation
gate:
- G2_EXECUTION
purpose: Create or update a Draft PR bound to the approved branch, scope, and exact head SHA; keep it Draft until required CI passes, an independent read-only reviewer completes, G3 evidence closes, and Ready-for-Review promotion guards pass.
entry_conditions:
- G2 authority validated independently
- route decision selected this node
- approved branch/scope/base-sha loaded
- node-start evidence recorded before the connector call
- task-scoped head SHA known and reconciled to approved scope
inputs:
- g2_envelope
- approval_receipt
- approved_paths
- working_branch
- base_sha
- head_sha
- scope_hash
- idempotency_key
allowed_actions:
- validate_requested_pr_scope
- reconcile_draft_pr_state
- create_or_update_draft_pr
- request_effect_readback
forbidden_actions:
- grant_gate_authority
- grant_g2_authority
- grant_g3_authority
- merge
- auto_merge
- deploy
- redeploy
- release
- publish
- runtime_reload
- production_configuration
- production_data
- credential_change
- secret_change
- migration
- force_push
- branch_deletion
- history_rewrite
- pr_base_change
outputs:
- draft_pr_decision
- draft_pr_result
- pending_action_or_idempotency_readback
evidence_required:
- node-start
- node-decision
- node-result
- node-readback
- checkpoint
- runtime-event
- next-route-decision
logs_required:
- runtime-events.jsonl
- decision_digest
- state_digest
- event_digest
retry:
  idempotency_key_fields:
  - task_id
  - run_id
  - node_id
  - scope_hash
  replay_check: Read canonical node evidence and the existing draft PR state readback before repeating the connector call.
  max_attempts: 3
  pending_reconciliation: Unknown or pending draft PR effects must route to checkpoint/reconciliation; never repeat blindly.
rollback:
  reversible: true
  strategy: Reconcile current draft PR state against the approved scope and restore only reversible task-scoped effects (close/idempotent reconcile), never change base or force-push.
  reconciliation: Record rollback or no-op readback in the canonical node evidence ledger.
  human_required_when:
  - scope drift
  - authority mismatch
  - unknown external effect
  - irreversible effect
authority_boundary:
  statement: Node instructions constrain execution and do not grant G2, G3, G4, G5, or G6 authority. Draft PR creation is bounded; merge/promotion to pre-prod or main remains Human-G4.
  node_grants_gate_authority: false
  g2_authority_granted: false
  g3_authority_granted: false
  merge_authority_granted: false
  deployment_authority_granted: false
  production_authority_granted: false
mode_policy:
  supported_modes:
  - normal
  - fastlane
  - e2e
  - hotfix
  - rescue
  runtime_required: true
  boot_required: true
  claim_required: true
  gate_authority_required: true
  route_required: true
  instruction_required: true
  evidence_required: true
  logs_required: true
  next_route_required: true
next:
  pass:
    disposition: continue
    reason: Node outcome passed; continue only through the canonical route.
    next_node: repo_delivery.pr-blocker-check
    next_action: pr_blocker_check
    next_gate: G3_PR
  blocked:
    disposition: stop
    reason: Fail closed and report the stable blocker without invoking later effects.
    next_node: null
    next_action: stop_and_report_blocker
    next_gate: null
  pending:
    disposition: wait
    reason: Persist a checkpoint and reconcile the pending external draft PR state before continuation.
    next_node: null
    next_action: persist_checkpoint_and_wait
    next_gate: null
  retry:
    disposition: retry
    reason: Replay only after idempotency and readback reconciliation pass.
    next_node: null
    next_action: reconcile_then_retry
    next_gate: null
