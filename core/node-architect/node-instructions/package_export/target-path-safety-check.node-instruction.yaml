schema_version: '1.0'
artifact_type: node-instruction
node_id: package_export.target-path-safety-check
gate:
- G2_EXECUTION
- G3_PR
forbidden_actions:
- grant_gate_authority
- grant_g2_authority
- grant_g3_authority
- merge
- auto_merge
- deploy
- redeploy
- release
- publish
- runtime_reload
- production_configuration
- production_data
- credential_change
- secret_change
- migration
- force_push
- branch_deletion
- history_rewrite
- pr_base_change
evidence_required:
- node-start
- node-decision
- node-result
- node-readback
- checkpoint
- runtime-event
- next-route-decision
logs_required:
- runtime-events.jsonl
- decision_digest
- state_digest
- event_digest
retry:
  idempotency_key_fields:
  - task_id
  - run_id
  - node_id
  - scope_hash
  replay_check: Validate that the canonical node evidence and the target-set digest match the last invocation; reject replayed target sets with a stale scope_hash without re-evaluation.
  max_attempts: 3
  pending_reconciliation: Unknown or pending external state (e.g. unknown readback of an existing target) must route to checkpoint/reconciliation before retrying; never re-evaluate blindly.
rollback:
  reversible: true
  strategy: Target path safety check is a pure read-only gate; revert any downstream artifact references produced from a failed check and restore the prior evidence ledger entry.
  reconciliation: Record rollback or no-op readback in the canonical node evidence ledger.
  human_required_when:
  - scope drift
  - authority mismatch
  - unknown external effect
  - irreversible effect
authority_boundary:
  statement: Node instructions constrain execution and do not grant G2, G3, G4, G5, or G6 authority. Target path safety check is execution-plane evidence only.
  node_grants_gate_authority: false
  g2_authority_granted: false
  g3_authority_granted: false
  merge_authority_granted: false
  deployment_authority_granted: false
  production_authority_granted: false
mode_policy:
  supported_modes:
  - normal
  - fastlane
  - e2e
  - hotfix
  - rescue
  runtime_required: true
  boot_required: true
  claim_required: true
  gate_authority_required: true
  route_required: true
  instruction_required: true
  evidence_required: true
  logs_required: true
  next_route_required: true
purpose: >-
  Reject unsafe, duplicate, or output-root-escaping consumer target paths before
  any file is written. Produce a typed SafetyPlan (ordered TargetDecision list +
  semantic_digest) that is the sole PASS signal. Fail closed on empty, absolute,
  backslash, parent-traversal, output-root-escaping, reserved-control-path,
  duplicate, case-collision, self-copy, or unprotected-overwrite targets.
entry_conditions:
- G2 authority validated independently
- route decision selected this node
- package_export.entry-schema-validation passed
- approved output root / package prefix resolved (DEFAULT_APPROVED_PREFIX = ".governance/")
inputs:
- target set (consumer-relative export target paths)
- output_root (the package root being exported)
- approved_prefix (bounded output-root prefix)
- overwrite_policy ("block" | "idempotent")
- run_identity (idempotency / digest identity)
- existing_state (normalized target -> content digest, or None for unknown readback)
allowed_actions:
- normalize_target_paths
- evaluate_target_against_closed_taxonomy
- detect_duplicate_normalized_targets
- detect_case_collision_targets
- detect_self_copy_conflict
- evaluate_overwrite_idempotency
- report_safety_plan_and_decisions
- write node-start evidence
- write node-result evidence
- write node-readback evidence
outputs:
- SafetyPlan (decisions, semantic_digest, outcome)
- ordered TargetDecision list (target, normalized, outcome, reason, overwrite_decision, semantic_digest)
- semantic_digest of the typed plan
next:
  pass:
    disposition: continue
    reason: All targets safe and output-root bounded; route to the next gate-sequenced node.
    next_node: package_export.governance-tree-build
    next_action: proceed_to_governance_tree_build
    next_gate: G3_PR
  blocked:
    disposition: stop
    reason: Fail closed on any unsafe/escaping/duplicate target and report the stable blocker without invoking downstream effects or export.
    next_node: null
    next_action: stop_and_report_blocker
    next_gate: null
  pending:
    disposition: wait
    reason: Persist a checkpoint and reconcile the pending external state (unknown readback) before continuation.
    next_node: null
    next_action: persist_checkpoint_and_wait
    next_gate: null
  retry:
    disposition: retry
    reason: Replay only after idempotency and readback reconciliation pass.
    next_node: null
    next_action: reconcile_then_retry
    next_gate: null
