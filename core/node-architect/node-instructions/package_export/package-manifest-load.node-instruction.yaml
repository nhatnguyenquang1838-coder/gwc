schema_version: '1.0'
artifact_type: node-instruction
node_id: package_export.package-manifest-load
gate:
- G2_EXECUTION
forbidden_actions:
- grant_gate_authority
- grant_g2_authority
- grant_g3_authority
- merge
- auto_merge
- deploy
- redeploy
- release
- publish
- runtime_reload
- production_configuration
- production_data
- credential_change
- secret_change
- migration
- force_push
- branch_deletion
- history_rewrite
- pr_base_change
evidence_required:
- node-start
- node-decision
- node-result
- node-readback
- checkpoint
- runtime-event
- next-route-decision
logs_required:
- runtime-events.jsonl
- decision_digest
- state_digest
- event_digest
retry:
  idempotency_key_fields:
  - task_id
  - run_id
  - node_id
  - scope_hash
  replay_check: Validate that canonical node evidence and the source manifest digest match the last invocation; reject replayed manifests with stale source_sha without re-evaluation.
  max_attempts: 3
  pending_reconciliation: Unknown or pending external state must route to checkpoint/reconciliation before retrying; never re-evaluate blindly.
rollback:
  reversible: true
  strategy: Package manifest load is a pure read-only tool; revert any downstream artifact references produced from a failed load and restore the prior evidence ledger entry.
  reconciliation: Record rollback or no-op readback in the canonical node evidence ledger.
  human_required_when:
  - scope drift
  - authority mismatch
  - unknown external effect
  - irreversible effect
authority_boundary:
  statement: Node instructions constrain execution and do not grant G2, G3, G4, G5, or G6 authority. Package manifest load is execution-plane evidence only.
  node_grants_gate_authority: false
  g2_authority_granted: false
  g3_authority_granted: false
  merge_authority_granted: false
  deployment_authority_granted: false
  production_authority_granted: false
mode_policy:
  supported_modes:
  - normal
  - fastlane
  - e2e
  - hotfix
  - rescue
  runtime_required: true
  boot_required: true
  claim_required: true
  gate_authority_required: true
  route_required: true
  instruction_required: true
  evidence_required: true
  logs_required: true
  next_route_required: true
purpose: >-
  Acquire the canonical project package manifest (projects/gwc/package.yaml) via
  a mutually-exclusive source XOR source_path evaluator argument, parse YAML via
  yaml.safe_load as a JSON-compatible object, validate it against the closed
  schemas/project-package.schema.json, and build deterministic entries preserving
  declared instruction order for downstream entry-schema-validation. Resolve a
  separate exact 40-hex Git source SHA as execution input. Produce a typed
  ManifestLoadResult that is the sole LOADED signal. Fail closed on unknown
  fields, missing or incomplete SourceBinding, ambiguous/missing source, stale
  observed source SHA, package-version mismatch, duplicate entry identifiers, and
  malformed payload. Never grants repository, PR, merge, deploy, or release
  authority.
entry_conditions:
- G2 authority validated independently
- route decision selected this node
- closed input schema version resolved (schemas/project-package.schema.json)
- exact 40-hex Git source SHA resolved
inputs:
- source (inline package payload: dict, YAML/JSON text, or bytes) XOR source_path (read-only local path)
- binding (external SourceBinding: task_id, repository, package_path, source_ref, source_sha, package_version)
- observed_source_sha (execution-only exact Git commit SHA; never stored in result)
- closed input schema (schemas/project-package.schema.json)
allowed_actions:
- acquire_manifest_source
- parse_yaml_safe_load
- validate_manifest_against_closed_schema
- resolve_source_sha_freshness
- normalize_instructions_to_ordered_entries
- report_load_result_and_errors
- write node-start evidence
- write node-result evidence
- write node-readback evidence
outputs:
- ManifestLoadResult (schema_id, schema_version, outcome LOADED|BLOCKED, manifest_digest, binding, source_sha, entries, errors, authority_granted)
- ordered LoadedEntry list sorted by declared instruction order
- ordered ManifestError list sorted by (reason_code, json_path)
- semantic_digest (sha256:) of the typed result
next:
  pass:
    disposition: continue
    reason: Manifest loaded; route to the next gate-sequenced node.
    next_node: package_export.entry-schema-validation
    next_action: proceed_to_entry_schema_validation
    next_gate: G2_EXECUTION
  blocked:
    disposition: stop
    reason: Fail closed and report the stable blocker without invoking downstream effects or export.
    next_node: null
    next_action: stop_and_report_blocker
    next_gate: null
  pending:
    disposition: wait
    reason: Persist a checkpoint and reconcile the pending external state before continuation.
    next_node: null
    next_action: persist_checkpoint_and_wait
    next_gate: null
  retry:
    disposition: retry
    reason: Replay only after idempotency and readback reconciliation pass.
    next_node: null
    next_action: reconcile_then_retry
    next_gate: null
