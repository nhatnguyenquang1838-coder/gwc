schema_version: '1.0'
artifact_type: node-instruction
node_id: package_export.entry-schema-validation
gate:
- G2_EXECUTION
- G3_PR
forbidden_actions:
- grant_gate_authority
- grant_g2_authority
- grant_g3_authority
- merge
- auto_merge
- deploy
- redeploy
- release
- publish
- runtime_reload
- production_configuration
- production_data
- credential_change
- secret_change
- migration
- force_push
- branch_deletion
- history_rewrite
- pr_base_change
evidence_required:
- node-start
- node-decision
- node-result
- node-readback
- checkpoint
- runtime-event
- next-route-decision
logs_required:
- runtime-events.jsonl
- decision_digest
- state_digest
- event_digest
retry:
  idempotency_key_fields:
  - task_id
  - run_id
  - node_id
  - scope_hash
  replay_check: Validate that canonical node evidence and the source manifest digest match the last invocation; reject replayed manifests with stale source_sha without re-evaluation.
  max_attempts: 3
  pending_reconciliation: Unknown or pending external state must route to checkpoint/reconciliation before retrying; never re-evaluate blindly.
rollback:
  reversible: true
  strategy: Entry schema validation is a pure read-only gate; revert any downstream artifact references produced from a failed validation and restore the prior evidence ledger entry.
  reconciliation: Record rollback or no-op readback in the canonical node evidence ledger.
  human_required_when:
  - scope drift
  - authority mismatch
  - unknown external effect
  - irreversible effect
authority_boundary:
  statement: Node instructions constrain execution and do not grant G2, G3, G4, G5, or G6 authority. Entry schema validation is execution-plane evidence only.
  node_grants_gate_authority: false
  g2_authority_granted: false
  g3_authority_granted: false
  merge_authority_granted: false
  deployment_authority_granted: false
  production_authority_granted: false
mode_policy:
  supported_modes:
  - normal
  - fastlane
  - e2e
  - hotfix
  - rescue
  runtime_required: true
  boot_required: true
  claim_required: true
  gate_authority_required: true
  route_required: true
  instruction_required: true
  evidence_required: true
  logs_required: true
  next_route_required: true
purpose: >-
  Validate every loaded package instruction entry against the closed entry schema
  before any path evaluation, filesystem access, or export. Produce a typed
  EntrySchemaValidationResult that is the sole PASS signal. Fail closed on unknown
  fields, missing required fields, type mismatches, invalid entry identifiers,
  unsupported entry versions, and duplicate identifiers.
entry_conditions:
- G2 authority validated independently
- route decision selected this node
- manifest loaded by package_export.package-manifest-load
- closed entry schema version resolved
inputs:
- manifest (loaded entries from package_export.package-manifest-load)
- source_sha of the approved package manifest
- closed entry schema (ENTRY_ID_PATTERN, REQUIRED_FIELDS, OPTIONAL_FIELDS, _FIELD_TYPES, SUPPORTED_ENTRY_VERSIONS)
allowed_actions:
- load_manifest_entries
- evaluate_entry_against_closed_schema
- report_entry_verdict_and_ordered_errors
- write node-start evidence
- write node-result evidence
- write node-readback evidence
outputs:
- EntrySchemaValidationResult (outcome, manifest_digest, schema_digest, inventory, errors, authority_granted)
- ordered EntryError list sorted by (entry_id, entry_index, json_path, reason_code)
- semantic_digest of the typed result
next:
  pass:
    disposition: continue
    reason: All entries validated; route to the next gate-sequenced node.
    next_node: package_export.target-path-safety-check
    next_action: proceed_to_path_safety_check
    next_gate: G3_PR
  blocked:
    disposition: stop
    reason: Fail closed and report the stable blocker without invoking downstream effects or export.
    next_node: null
    next_action: stop_and_report_blocker
    next_gate: null
  pending:
    disposition: wait
    reason: Persist a checkpoint and reconcile the pending external state before continuation.
    next_node: null
    next_action: persist_checkpoint_and_wait
    next_gate: null
  retry:
    disposition: retry
    reason: Replay only after idempotency and readback reconciliation pass.
    next_node: null
    next_action: reconcile_then_retry
    next_gate: null
