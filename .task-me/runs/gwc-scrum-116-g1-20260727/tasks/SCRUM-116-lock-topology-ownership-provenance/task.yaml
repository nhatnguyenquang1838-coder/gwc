implementation_plan:
- Confirm exact protected-base paths and existing contracts in an isolated G2 plan-read receipt.
- Define topology and source-of-truth matrix with one canonical owner per artifact class.
- Define owner-root matrix and denied writes for GWC, UA, Task-Me, BMAD, package store and adapters.
- Define provenance envelope fields and positive/negative examples bound to exact repo/tool refs.
- Define lease/fencing/CAS and idempotency collision behavior without replacing durable-runtime contracts.
- Define compatibility/fallback behavior for submodule, power-dist, immutable release and offline ZIP.
- Add contract validation, focused tests and task-scoped evidence only within the approved G2 file list.
test_plan:
- Validate YAML/JSON schemas and exact-SHA references.
- Assert exactly one canonical owner for every P4 artifact class.
- Assert projection systems cannot grant gate authority.
- Assert stale lease/fencing/CAS and scope mismatch are rejected.
- Assert compatibility modes preserve backward compatibility and no broad cleanup is required.
- Run focused GWC governance tests, compile checks and diff/scope review after G2 only.
definition_of_done:
- Versioned topology, ownership, provenance and compatibility contract is reviewable.
- Every acceptance criterion has source evidence and a validation command.
- Positive provenance and collision/fencing failure examples are present.
- SCRUM-117 through SCRUM-121 can reference the contract without conversation memory.
- No excluded action or unrelated file is changed.
