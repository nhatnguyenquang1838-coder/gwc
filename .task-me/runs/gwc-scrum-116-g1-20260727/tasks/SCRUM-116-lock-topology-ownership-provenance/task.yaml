scope:
  included:
  - DW-SuperApps control plane, package store and host adapters
  - Target-owned .gwc, .ua, .task-me and .bmad roots
  - GWC gate artifacts and exact-base evidence
  - UA read-only semantic/impact evidence
  - Task-Me planning output and BMAD architecture invariants
  - GitHub/CI, Jira, Notion and Slack authority/projection boundaries
