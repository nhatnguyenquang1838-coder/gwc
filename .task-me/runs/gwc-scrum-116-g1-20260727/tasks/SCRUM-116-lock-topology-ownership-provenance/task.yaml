decisions:
- decision: Reuse and extend existing GWC, distribution and durable-runtime mechanisms before refactor or replacement.
  rule: Reuse -> Extend -> Refactor -> Replace
  confidence: 0.96
- decision: Treat Jira, Notion and Slack as projections/communication, never as gate authority.
  rule: Canonical artifacts and exact repository/CI evidence remain authoritative.
  confidence: 0.99
