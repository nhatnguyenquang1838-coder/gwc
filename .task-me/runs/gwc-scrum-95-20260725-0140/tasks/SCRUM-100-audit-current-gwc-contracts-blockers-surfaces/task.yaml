implementation_plan:
- Build a table of declared behavior versus executable enforcement.
- Classify each finding as implemented, partial, contract-only, proposed or stale.
- Verify every blocker against a protected-base path and test where available.
- Separate edge-scenario count from graph-edge count.
- Publish current-state audit and unresolved evidence gaps.
test_plan:
- Path existence checks for every cited file.
- Cross-check audit statements against current tests and schemas.
- No inferred implementation may be labelled canonical.
definition_of_done:
- Every blocker has severity, owner surface, evidence path and remediation dependency.
- Four explicit runtime nodes and 77 proposed slots are clearly separated.
- Audit identifies whether main CI evidence was observed or unavailable.
