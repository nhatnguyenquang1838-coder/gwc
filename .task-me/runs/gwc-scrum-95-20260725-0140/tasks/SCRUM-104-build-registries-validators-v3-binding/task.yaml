implementation_plan:
- 'Review 77 proposed slots: keep, rename, merge, split, reject or defer.'
- Create canonical registry with explicit source_status and maturity.
- Create initial source-backed scenario definitions.
- Add schema and cross-registry validators.
- Import v3 renderer as a data-driven view with thin edges and inactive dimming.
- Add tests for registry loading, route classification and visual-only edges.
