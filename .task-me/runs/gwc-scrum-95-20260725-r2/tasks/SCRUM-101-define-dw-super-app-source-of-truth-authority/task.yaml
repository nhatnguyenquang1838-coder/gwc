implementation_plan:
- Define canonical owner for product source, requirements, knowledge, plans, gate
  state, runtime history and external status.
- Define GWC/UA/Task-Me/BMAD input/output contracts.
- Define prohibited cross-component writes.
- Define GitHub, deployment and Jira evidence/projection roles.
- Record compatibility rules for consumer projects.
