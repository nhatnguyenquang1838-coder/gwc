    likely_hours: 14
    pessimistic_hours: 22
  drivers:
  - governance contract coupling
  - cross-schema compatibility
  - test and consumer-package impact
implementation_plan:
- Define stable ID and independent semantic version fields.
- Separate effect, authority, reversibility, idempotency, suspension and determinism
  dimensions.
- Define runtime versus visualization edge categories.
- Define scenario facts, typed guards, green anchors and human boundaries.
- Define immutable graph revision and routing-history records.
- Create schema validation fixtures.
test_plan:
- Schema meta-validation.
- Positive and negative fixtures for every contract.
- Reject free-form executable guards.
- Reject promoted nodes without evidence contract and implementation owner.
definition_of_done:
- Schemas are versioned and additionalProperties policy is explicit.
- No graph edge is executable without provenance/type/rule.
- Node promotion checklist is machine-checkable.
evidence_refs:
