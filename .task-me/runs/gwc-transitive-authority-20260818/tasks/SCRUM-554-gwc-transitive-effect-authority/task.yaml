acceptance_criteria:
- id: SPEC-AC-1
  text: Issue AC1-AC8 are traced to implementation-plan steps and planned tests.
- id: SPEC-AC-2
  text: 'Conditional effect semantics are explicit: false excludes with evidence;
    true is reachable; unknown mutating/cross-repo/release/destructive/production
    effects are authority-closed as potentially reachable.'
- id: SPEC-AC-3
  text: Retention/delete effects map to a destructive capability distinct from ordinary
    release write/publish capability.
- id: SPEC-AC-4
  text: Legacy packets without per-packet graphs remain compatible through a versioned
    trusted effect profile only when the profile completely closes all reachable/potentially
    reachable effects within current or independent authority; otherwise effect graph
    is required and validation fails closed.
- id: SPEC-AC-5
  text: Historical successful workflow/check evidence from another SHA/event/gate
    cannot become current authority.
- id: SPEC-AC-6
  text: Fresh implementation session is required; current spec session grants no implementation/merge/deploy
    authority.
